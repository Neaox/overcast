# Automatically create GitHub issues from TODO-marked comments added in PRs.
#
# The marker must open the comment and carry a priority. The format and the
# reasoning for it live in CONTRIBUTING.md under "Honest TODOs", and
# `make lint-todos` enforces it. That gate is not cosmetic: this action matches
# its marker *anywhere* in a comment and takes the rest of the line as the
# issue title, so a marker named mid-sentence in prose becomes a nonsense
# issue — see issue #1138, whose title was "on apigateway.Method) —
# intentionally not" — and a stray lowercase "todo" in ordinary prose would
# open one of its own. The identifier list below is matched in order, so the
# priority variants come first and the bare marker last.
#
# Only newly added lines are detected (the action diffs the push).
# Created issues use the feature request template structure and are
# labelled `needs-info` so maintainers know to fill in details.
#
# Uses: https://github.com/alstr/todo-to-issue-action
name: TODO to Issue

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: alstr/todo-to-issue-action@37bb7b56e58569ef273b60678048030a7f0c261a # v5
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STANDARD: "true"
          LANGUAGES: .github/todo-languages.json
          # repo_provider_test.go builds its fixtures as Go string literals
          # that contain canonical markers — test data for the MCP
          # repo_find_todos tool. The action cannot tell a string literal from
          # a comment, so editing a fixture would file an issue for it.
          IGNORE: ^internal/mcp/providers/repo_provider_test\.go$
          # Matched in order, first hit wins. The priority variants exist so a
          # priority in the marker becomes a `priority/pN` label instead of a
          # `[priority:P3] ` prefix glued onto the issue title.
          IDENTIFIERS: |
            [
              {"name": "TODO(priority:P0)", "labels": ["auto-todo", "needs-info", "priority/p0"]},
              {"name": "TODO(priority:P1)", "labels": ["auto-todo", "needs-info", "priority/p1"]},
              {"name": "TODO(priority:P2)", "labels": ["auto-todo", "needs-info", "priority/p2"]},
              {"name": "TODO(priority:P3)", "labels": ["auto-todo", "needs-info", "priority/p3"]},
              {"name": "TODO", "labels": ["auto-todo", "needs-info"]}
            ]
          # No {{ snippet }}. The action fences it as ```text whatever the
          # language — it hardcodes ace_mode for every language loaded from a
          # custom LANGUAGES file, and NO_STANDARD makes all of ours custom —
          # and it emits the whole diff hunk, which on issue #1138 was twenty
          # lines of code the marker had nothing to do with. {{ url }} is the
          # better snippet: GitHub expands a permalink to a line range into an
          # embedded blob, syntax-highlighted, line-numbered and click-through
          # to the file at that commit.
          ISSUE_TEMPLATE: |
            ## What would you like

            {{ body }}

            ## Which service and operation

            **Service:** _fill in_
            **Operation(s):** _fill in_
            **AWS docs link:** _fill in_

            ---

            ## Source

            {{ url }}

            ---

            > This issue was auto-created from a comment marker.
            > Please add acceptance criteria, priority (`P1`/`P2`/`P3`),
            > and effort (`small`/`medium`/`large`) labels.
          CLOSE_ISSUES: "false"
          # ESCAPE backslash-escapes every Markdown metacharacter in the body,
          # which turned "`down -v`" into "\`down \-v\`" on issue #1044. Our
          # markers are prose that quotes identifiers in backticks, so the
          # escaping costs more than it buys.
          ESCAPE: "false"
          # AUTO_P puts a blank line between every line of the comment, which
          # splits one wrapped sentence into a paragraph per line.
          AUTO_P: "false"
