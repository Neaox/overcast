name: Release

on:
  push:
    branches: [main]
  pull_request:
    # Into `main` and the `support/**` maintenance lines, both of which a
    # release is cut from. Never into a `release/**` branch: the question this
    # asks of a PR is "if this tree became the release, would the release gate
    # pass?", and there it answers with advice that does not apply — fold the
    # fragment into the section, when the fragment is correct and the *base* is
    # the mistake. `release-branch-base.yml` refuses that shape outright and
    # says so in its own words.
    branches: [main, "support/**"]
    paths:
      - VERSION
      - CHANGELOG.md
      # During a release-candidate window every same-repo PR must keep the
      # changelog releasable, and fragments are part of that: a fragment
      # merged mid-window trips the unconsumed-fragments release gate.
      # Surface that on the PR that adds it, not on the next release re-run.
      - ".changelog/**"
      - .github/workflows/release.yml
      - scripts/check-release-changelog.py
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      is_prerelease: ${{ steps.read.outputs.is_prerelease }}
      release_url: ${{ steps.read.outputs.release_url }}
      should_release: ${{ steps.decide.outputs.should_release }}
      release_reason: ${{ steps.decide.outputs.release_reason }}
      floating_tags: ${{ steps.tags.outputs.floating_tags }}
      floating_tag_list: ${{ steps.tags.outputs.floating_tag_list }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read release version
        id: read
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || 'false' }}
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$FILE_VERSION" ]; then
            echo "VERSION must not be empty." >&2
            exit 1
          fi
          TAG=$(printf '%s' "$RELEASE_TAG" | tr -d '[:space:]')
          if [ -z "$TAG" ]; then
            TAG="v$FILE_VERSION"
          fi
          VERSION=${TAG#v}
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Release tag $TAG does not match VERSION ($FILE_VERSION)." >&2
            exit 1
          fi
          # Only whether this is a prerelease, which is the flag the GitHub
          # release carries. The *channel name* it publishes under is no longer
          # derived here: scripts/release-channel-tags.py owns that, along with
          # whether the channel tag is allowed to move at all, and reads it from
          # the version string — the single source of truth for what a release
          # is, and the one the tag/VERSION check above has already validated.
          if [ "$RELEASE_PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether release is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          SHOULD_RELEASE=false
          RELEASE_REASON="release already exists for $TAG"

          if [ "$EVENT_NAME" = "release" ]; then
            SHOULD_RELEASE=true
            RELEASE_REASON="release event"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_RELEASE=true
            RELEASE_REASON="manual dispatch"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            RELEASE_REASON="pull request validation"
          else
            VERSION_CHANGED=false
            if [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
              if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- VERSION | grep -q '^VERSION$'; then
                VERSION_CHANGED=true
              fi
            fi

            if [ "$VERSION_CHANGED" = "true" ]; then
              SHOULD_RELEASE=true
              RELEASE_REASON="VERSION changed"
            elif ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              SHOULD_RELEASE=true
              RELEASE_REASON="release $TAG is missing"
            fi
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
            echo "release_reason=$RELEASE_REASON"
          } >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_RELEASE" != "true" ]; then
            echo "Skipping release: $RELEASE_REASON"
          fi

      # Reachability, which is the thing a maintenance line actually depends on.
      #
      # The step above compares the tag to VERSION, and VERSION is just a file:
      # it would pass a tag cut against any commit that happens to carry the
      # right contents — an abandoned backport branch, a detached HEAD, a stale
      # local checkout. Nothing about that commit is then reachable from a
      # branch, so nothing stops it being garbage-collected out from under a
      # published release. So assert what the branch protection is protecting:
      # the commit being released is reachable from `main`, or from the
      # `support/<major>.<minor>` branch that owns its line.
      #
      # `support/**` exists only for a line `main` has already left (RELEASE.md
      # § Maintenance Releases), so the two cases cannot both be wrong: a
      # mainline release is on `main` and a maintenance release is on its
      # support branch. Absent a support branch this is the mainline check
      # alone, which every release path today already satisfies.
      - name: Check the release commit is reachable
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.read.outputs.version }}
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          CORE=${VERSION%%-*}
          LINE=${CORE%.*}
          BRANCH="support/$LINE"

          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_SHA is reachable from main."
            exit 0
          fi

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::$TAG would be cut at $GITHUB_SHA, which is not on main and has no $BRANCH branch to be on. A release must be reachable from a protected branch or nothing keeps its history alive — see RELEASE.md § Maintenance Releases."
            exit 1
          fi

          git fetch --no-tags --quiet origin "$BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$TAG would be cut at $GITHUB_SHA, which is on neither main nor $BRANCH. Push the backport to $BRANCH and re-cut the release from its tip; a tag on an unreachable commit survives only until the next garbage collection."
            exit 1
          fi
          echo "$GITHUB_SHA is reachable from $BRANCH — maintenance release."

      # Which floating Docker tags this release may move. `:latest`, `:alpha`
      # and the line tags `:1` / `:1.2` are pointers, and a pointer can move
      # the wrong way: publishing `:latest` for any stable release walks it
      # backwards the first time an older line is patched after a newer one has
      # shipped. The rule is scripts/release-channel-tags.py — one function,
      # unit tests beside it, the same shape as scripts/release-hold.py —
      # because a policy expressed as inline YAML bash is neither testable nor
      # reviewable. This step only carries the answer to the publish jobs.
      #
      # `git tag` rather than the releases API: fetch-depth 0 above already has
      # every tag locally, and a tag is what "already released" means here —
      # RELEASE.md requires every release, maintenance ones included, to be
      # tagged.
      - name: Decide floating Docker tags
        id: tags
        # Only when something is actually being published. On a pull request
        # there is nothing to tag, and an unparseable VERSION is fatal to this
        # script by design — that belongs to the release, not to every PR that
        # touches CHANGELOG.md.
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/released.txt"
          {
            echo 'floating_tags<<FLOATING_TAGS_EOF'
            python3 scripts/release-channel-tags.py "$VERSION" \
              --released "$RUNNER_TEMP/released.txt" --format metadata
            echo 'FLOATING_TAGS_EOF'
            printf 'floating_tag_list=%s\n' "$(python3 scripts/release-channel-tags.py \
              "$VERSION" --released "$RUNNER_TEMP/released.txt" | paste -sd, -)"
          } >> "$GITHUB_OUTPUT"

      # Release-candidate detection is one predicate, shared with the CI
      # workflow's release-gate job: the checked-out VERSION has no v<VERSION>
      # tag yet. A "did this PR change VERSION" diff was used here before, and
      # it went blind in exactly the case that matters most — a follow-up PR
      # after a failed release workflow, when the unreleased version already
      # sits on main and the changelog still has to hold.
      - name: Check release candidate
        id: pr-changes
        if: github.event_name == 'pull_request'
        run: |
          echo "release_candidate=$(bash scripts/release-candidate-check.sh)" >> "$GITHUB_OUTPUT"

      - name: Validate changelog release section
        if: steps.decide.outputs.should_release == 'true' || steps.pr-changes.outputs.release_candidate == 'true'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          python3 scripts/check-release-changelog.py "$VERSION"

      # The step above sees the base as it stood when the head branch last
      # moved: merging another PR into main re-triggers nothing on an open PR.
      # A fragment that lands mid-window is invisible to it — the release PR
      # deleted a disjoint set of fragments, so the merge is a clean union and
      # the new fragment rides onto main next to the VERSION bump, failing the
      # release only after it merges. Re-run the same gate against the tree
      # this PR would actually produce. Deliberately narrower than requiring
      # the branch be up to date: a merge that touches no changelog files
      # leaves this green rather than demanding a pointless rebase.
      #
      # `main` only. On a PR into a `support/**` line, `main` is not the base
      # and never will be — the branch never merges back (RELEASE.md
      # § Maintenance Releases) — so merge-treeing the two would compare the
      # maintenance section against a changelog that has moved on by a whole
      # minor and fail every time.
      - name: Validate changelog against current main
        if: steps.pr-changes.outputs.release_candidate == 'true' && github.base_ref == 'main'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -o pipefail
          git fetch --no-tags origin main
          if ! tree=$(git merge-tree --write-tree HEAD FETCH_HEAD); then
            echo "::error::Release PR conflicts with current main; update the branch."
            exit 1
          fi
          merged="$RUNNER_TEMP/merged"
          mkdir -p "$merged"
          git archive "$tree" CHANGELOG.md .changelog | tar -x -C "$merged"
          if ! python3 scripts/check-release-changelog.py "$VERSION" \
            --changelog "$merged/CHANGELOG.md" \
            --fragments-dir "$merged/.changelog"; then
            echo "::error::Errors above are against main as of now, not this PR's base — the $merged paths mirror the post-merge tree. main moved since this branch was last updated; re-curate and update the branch."
            exit 1
          fi

  test:
    name: Test
    needs: [check-version, web]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - run: go mod download
      - run: go vet ./...
      - name: Tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out -timeout=1200s ./...

  web:
    name: Web UI build
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # No setup-go: the docs index is committed, so the SPA build no longer
      # shells out to the Go generator. This job is Node-only.
      # pnpm/action-setup must precede setup-node: `cache: pnpm` resolves the
      # store path by running pnpm, so pnpm has to be on PATH by then.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Not `tsc --noEmit`: that resolves web/tsconfig.json, a
      # solution-style config with "files": [] and only project references, so
      # it compiles zero files and always passes. See .github/workflows/test.yml.
      - name: Type check
        run: pnpm run typecheck
      - run: VITE_BUNDLED=true pnpm run build
      - name: Upload web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # The binary set is defined once in build-binaries.yml and shared with
  # the CI workflow's cross-build check, so what was tested on the release
  # PR is what gets published here — same matrix, same composite action.
  binaries:
    name: Build
    needs: [check-version, test, web]
    if: needs.check-version.outputs.should_release == 'true' && needs.test.result == 'success' && needs.web.result == 'success'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
      upload-artifacts: true
      retention-days: 90

  release-assets:
    name: Publish release assets
    # Publishing requires a one-click approval of this exact SHA in the
    # 'release' environment (required reviewer: the maintainer). Everything
    # before this point runs unattended; nothing ships without a human.
    environment: release
    needs: [check-version, binaries]
    if: needs.check-version.outputs.should_release == 'true' && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: overcast*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          sha256sum -- "${assets[@]}" > SHA256SUMS
      - name: Generate release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          FLOATING_TAGS: ${{ needs.check-version.outputs.floating_tag_list }}
          RELEASE_URL: ${{ needs.check-version.outputs.release_url }}
        run: |
          mkdir -p release-metadata
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          owner = os.environ["OWNER"]
          owner_lc = owner.lower()
          repository = os.environ["REPOSITORY"]
          repo_name = repository.split("/", 1)[1]
          release_url = os.environ.get("RELEASE_URL", "")
          # The tags that actually moved, as decided by
          # scripts/release-channel-tags.py — not what a stable/prerelease flag
          # implies. A maintenance release of an older line moves :1.2 and
          # nothing else, and notes claiming `:latest` points here would be
          # wrong in the one direction that costs a user a downgrade.
          floating = [
              name for name in os.environ.get("FLOATING_TAGS", "").split(",") if name
          ]

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          def strip_comments(text: str) -> str:
              return re.sub(r"<!--.*?-->", "", text, flags=re.S).strip()

          def section(name: str) -> str | None:
              pattern = re.compile(rf"^## \[{re.escape(name)}\].*?$", re.M)
              match = pattern.search(changelog)
              if not match:
                  return None
              rest = changelog[match.end():]
              next_match = re.search(r"^## ", rest, flags=re.M)
              body = rest[: next_match.start()] if next_match else rest
              body = strip_comments(body)
              return body or None

          notes = section(version) or section(tag) or section("Unreleased")
          if not notes:
              notes = "See the changelog for release details."

          checksum_rows = []
          for line in Path("dist/SHA256SUMS").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              digest, asset = line.split(None, 1)
              asset = asset.removeprefix("*")
              checksum_rows.append((asset, digest))
          checksum_rows.sort()

          asset_rows = ["| Asset | SHA256 |", "| ----- | ------ |"]
          for asset, digest in checksum_rows:
              asset_rows.append(f"| `{asset}` | `{digest}` |")

          def moving_tag_lines(image: str) -> str:
              return "\n".join(
                  f"- Moving tag: `ghcr.io/{owner_lc}/{image}:{name}`"
                  for name in floating
              )

          console_tag_lines = moving_tag_lines("overcast")
          slim_tag_lines = moving_tag_lines("overcast-slim")

          body = f"""# Overcast {tag}

          ## Docker Images

          Full image with the web management console:

          - Pull: `ghcr.io/{owner_lc}/overcast:{version}`
          {console_tag_lines}
          - Registry: [overcast package](https://github.com/{repository}/pkgs/container/overcast)

          Headless slim image for CI pipelines:

          - Pull: `ghcr.io/{owner_lc}/overcast-slim:{version}`
          {slim_tag_lines}
          - Registry: [overcast-slim package](https://github.com/{repository}/pkgs/container/overcast-slim)

          ```sh
          docker run --rm -p 4566:4566 -p 4567:4567 ghcr.io/{owner_lc}/overcast:{version}
          docker run --rm -p 4566:4566 ghcr.io/{owner_lc}/overcast-slim:{version}
          ```

          ## Native Binaries

          Download a binary for your platform from the assets below and verify it with `SHA256SUMS`.

          {chr(10).join(asset_rows)}

          ## Release Notes

          {notes}
          """
          body = re.sub(r"^          ", "", body, flags=re.M).strip() + "\n"
          if release_url:
              body += f"\nRelease: {release_url}\n"

          Path("release-metadata/release-body.md").write_text(body, encoding="utf-8")
          EOF
      - name: Upload assets to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.check-version.outputs.is_prerelease }}
          files: dist/*
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata/release-body.md
          if-no-files-found: error

  publish-console:
    name: Publish console Docker image
    # Publishing requires a one-click approval of this exact SHA in the
    # 'release' environment (required reviewer: the maintainer). Everything
    # before this point runs unattended; nothing ships without a human.
    environment: release
    needs: [check-version, test, web]
    if: needs.check-version.outputs.should_release == 'true' && needs.test.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/overcast
          # The immutable tag is written here, where a reader can see that it
          # is unconditional. Every moving tag — :latest, :alpha, :1, :1.2 —
          # comes from the check-version job, which asked
          # scripts/release-channel-tags.py whether this release is allowed to
          # move each one. An `enable=` expression on `is_prerelease` alone,
          # which is what used to be here, cannot answer that: it publishes
          # :latest for *any* stable release, so the first patch of an older
          # line after a newer minor shipped would take :latest backwards.
          tags: |
            type=raw,value=${{ needs.check-version.outputs.version }}
            ${{ needs.check-version.outputs.floating_tags }}

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.check-version.outputs.version }}
          cache-from: type=gha,scope=overcast-console
          cache-to: type=gha,mode=max,scope=overcast-console

  publish-slim:
    name: Publish slim Docker image
    # Publishing requires a one-click approval of this exact SHA in the
    # 'release' environment (required reviewer: the maintainer). Everything
    # before this point runs unattended; nothing ships without a human.
    environment: release
    needs: [check-version, test, web]
    if: needs.check-version.outputs.should_release == 'true' && needs.test.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/overcast-slim
          # Same tag set as the console image — see the comment there.
          tags: |
            type=raw,value=${{ needs.check-version.outputs.version }}
            ${{ needs.check-version.outputs.floating_tags }}

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # `target` is the only thing that selects the slim flavour: it picks
          # a builder stage that compiles `-tags slim,nosqlite` and asserts the
          # result before the runtime stage can copy it. It used to need a
          # `NOSQLITE=1` build arg alongside, which this job never passed — so
          # `overcast-slim` shipped the console binary, SPA and all, for at
          # least two releases (#798). Do not reintroduce a build arg that has
          # to agree with the target.
          target: slim
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.check-version.outputs.version }}
          cache-from: type=gha,scope=overcast-slim
          cache-to: type=gha,mode=max,scope=overcast-slim

  finalize-release:
    name: Finalize GitHub release
    # Deliberately NOT in the 'release' environment, unlike every job above.
    #
    # The environment's approval covers publishing, and by the time this runs
    # everything has already been published: assets uploaded, both images
    # pushed, the release created. All this does is fill in the release
    # description from a file the release-assets job already generated.
    #
    # It also depends on those three jobs, so gating it would put it in a
    # second approval wave — the maintainer approves once, the release
    # completes and looks finished, and this sits waiting for an approval
    # nobody knows to give. That is exactly what left v0.0.1-alpha.27 and
    # v0.0.1-alpha.28 published with empty release notes.
    needs: [check-version, release-assets, publish-console, publish-slim]
    if: needs.check-version.outputs.should_release == 'true' && needs.release-assets.result == 'success' && needs.publish-console.result == 'success' && needs.publish-slim.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Update release notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.check-version.outputs.is_prerelease }}
          body_path: release-metadata/release-body.md
      - name: Write release summary
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TAG: ${{ needs.check-version.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_URL: ${{ needs.check-version.outputs.release_url }}
        run: |
          owner_lc=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "## Release finalized"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo "- Release: $RELEASE_URL"
            echo "- Console image: \`ghcr.io/$owner_lc/overcast:$VERSION\`"
            echo "- Slim image: \`ghcr.io/$owner_lc/overcast-slim:$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
