name: Changelog required

# Every PR either records a release note or records that it needs none.
#
# A forgotten fragment and a fragment nobody needed are the same empty
# `.changelog/` diff, so the gap cannot be spotted by looking at the change —
# only the author knows which it is. This asks, and takes the answer as a
# comment: `/no-changelog <reason>`, kept as the record of the decision. The
# reasoning, and why a reason is required rather than a bare acknowledgement,
# is in scripts/changelog-required.py.
#
# The waiver is read from the PR's comments *here*, when the verdict is made —
# not applied by whatever workflow the comment triggered. So a `/no-changelog`
# posted before this ever runs is already in force by the time it does, and one
# posted afterwards is picked up by changelog-waiver.yml re-running this. One
# place decides; the other only replays it.
#
# A separate workflow file rather than a job in test.yml, for the same reason
# as release-hold.yml: a re-run re-runs every job in the run, and replaying one
# tiny job is cheap where replaying the CI matrix is not.

# `main` only, and deliberately **not** `support/**`. On a maintenance line a
# fragment cannot work: the fix's fragment was consumed by the release that
# shipped it on main, no release-prep run will ever fold one in, and one left
# in .changelog/ fails the very release it describes. The note is written
# straight into CHANGELOG.md there — which is precisely the answer this check
# refuses to accept, by design, everywhere it does run. Asking the question on
# a branch where the only correct answer is rejected would make `/no-changelog`
# a reflex on every backport. See RELEASE.md § Maintenance Releases, which
# records that nothing enforces the note on those branches.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: changelog-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entry:
    # This name is the required status check on main. Renaming it silently
    # stops enforcing the gate, because branch protection matches by name.
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's own changes are a diff from the merge base, computed
          # below against the base branch's live tip rather than the event
          # payload's base.sha (#813) — 0 fetches every branch as a
          # remote-tracking ref, so origin/<base> is in the clone to diff
          # against.
          fetch-depth: 0

      # Fork PRs get no secrets, so they get no comment. The check still runs
      # and still fails with the whole message in the job summary — a fork PR
      # cannot be merged without a maintainer, who can read it there and run
      # the command themselves.
      - name: Look for the release App credentials
        id: app
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release App credentials on this run (fork PR); the verdict goes to the job summary instead of a comment."
          fi

      # Shared predicate with release.yml and the CI release gate: the
      # checked-out VERSION has no tag yet. It covers the release PR itself and
      # any follow-up after a failed release run, which a release/* branch-name
      # test would miss.
      #
      # It is read *twice below*, for two different things, and the difference
      # is the whole of why this job used to get the release PR wrong.
      #
      # Which window a PR is in. On an ordinary PR the checked-out VERSION
      # comes from main, so while the release PR is merely open this is false
      # and a fragment is asked for exactly as usual — release-prep.yml folds
      # it into the release section on the next push to main and deletes the
      # fragment, unattended. Once that PR has merged, main carries the
      # untagged version, an unconsumed fragment fails the release, and there
      # is nothing left to fold into — so the ask changes wording to "wait for
      # the tag or waive". Neither message offers a CHANGELOG.md edit: that
      # file belongs to the release PR.
      #
      # Whether this PR *is* the release. On the release branch the
      # checked-out VERSION is the new one, so this is true there too — which
      # is a third case, not the second one. Passed to the check as one part of
      # the release-PR shape (with VERSION, CHANGELOG.md and the version
      # section), it exempts that PR outright. Left to select a message on its
      # own, as it was, it posted the merged-and-untagged text on the very PR
      # that had not merged yet.
      - name: Check release candidate
        id: release
        run: |
          set -euo pipefail
          echo "candidate=$(bash scripts/release-candidate-check.sh)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # github.token is enough: reading comments needs no App, and a fork PR's
      # read-only token can still do it. Each page arrives as its own array;
      # `jq -s add` makes them one.
      - name: Read the PR's comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | {id, body, author_association, created_at, html_url, login: .user.login}]' \
            | jq -s 'add // []' > comments.json

      - name: Decide
        id: decide
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE_CANDIDATE: ${{ steps.release.outputs.candidate }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          # For the dependency-bot exemption. A bot suffix ([bot]) cannot be
          # taken by a user account, so the login is proof of authorship; the
          # script still requires the diff to be nothing but manifests.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # NOT github.event.pull_request.base.sha (#813): that sha is a
          # snapshot of the base branch taken when the event fired, stale the
          # moment another PR merges to it and unchanged by a re-run (which
          # replays the same payload). scripts/pr-merge-base.sh has the full
          # reasoning and the regression test; here it just needs the base
          # branch's live tip, which fetch-depth: 0 above already fetched as
          # origin/$BASE_REF.
          MERGE_BASE="$(bash scripts/pr-merge-base.sh "origin/$BASE_REF")"

          # Added or modified only: a fragment this PR deletes is not its
          # release note, and neither is one already sitting on main.
          #
          # Two steps, not one pipeline: '|| true' for grep finding nothing
          # would also swallow a failing diff, and an empty list reads as "no
          # fragment" — the PR would be asked for one it already has.
          git diff --name-only --diff-filter=AM "$MERGE_BASE..HEAD" -- .changelog > fragments.txt
          readarray -t fragments < <(grep -v '^\.changelog/README\.md$' fragments.txt || true)

          # Everything the PR touches, for the never-release-noted areas.
          # Deletions included; --no-renames so a file moved *into* an exempt
          # area still shows the path it came from.
          git diff --name-only --no-renames "$MERGE_BASE..HEAD" > changed.txt

          # Which of the two release-window messages to use, if one is needed
          # at all. A PR that moves VERSION to the untagged version *is* the
          # release, whatever else it carries — so it must never be told the
          # release has already merged. The pure case is exempted outright by
          # the check below; this covers the impure one, a release branch that
          # also carries a code change and therefore does owe a note.
          if grep -qx 'VERSION' changed.txt; then
            echo "on_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

          verdict="$(python3 scripts/changelog-required.py check \
            --changed-files-file changed.txt \
            --comments-file comments.json \
            --waiver-file waiver.json \
            --release-candidate "$RELEASE_CANDIDATE" \
            --version "$RELEASE_VERSION" \
            --author "$PR_AUTHOR" \
            --changelog CHANGELOG.md \
            "${fragments[@]}")"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Verdict: $verdict"

      - name: Render the message
        if: steps.decide.outputs.verdict == 'missing' || steps.decide.outputs.verdict == 'waived'
        env:
          VERDICT: ${{ steps.decide.outputs.verdict }}
          RELEASE_CANDIDATE: ${{ steps.release.outputs.candidate }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ON_RELEASE_BRANCH: ${{ steps.decide.outputs.on_release_branch }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" = "waived" ]; then
            WAIVED_BY="$(jq -r '.by' waiver.json)"
            WAIVER_REASON="$(jq -r '.reason' waiver.json)"
            WAIVER_URL="$(jq -r '.url' waiver.json)"
            export WAIVED_BY WAIVER_REASON WAIVER_URL
            python3 scripts/render-template.py .github/release-bot/changelog-waived.md > comment.md
          elif [ "$RELEASE_CANDIDATE" = "true" ] && [ "$ON_RELEASE_BRANCH" = "true" ]; then
            # This PR is the release and carries something else besides. The
            # note goes into its own release section — the one PR where a
            # CHANGELOG.md edit is the answer rather than the thing to avoid.
            python3 scripts/render-template.py \
              .github/release-bot/changelog-missing-release-branch.md > comment.md
          elif [ "$RELEASE_CANDIDATE" = "true" ]; then
            # The release has merged and is waiting to be tagged: a fragment
            # would fail it, so the ask has to name the other place to write it.
            python3 scripts/render-template.py \
              .github/release-bot/changelog-missing-release-window.md > comment.md
          else
            cp .github/release-bot/changelog-missing.md comment.md
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Note that this is dependency automation
        if: steps.decide.outputs.verdict == 'dependencies'
        run: |
          echo "::notice::Automated dependency update: authored by Renovate, touching only dependency manifests. The decision this check asks for is recorded once, in .github/renovate.json5. A bump that merits a release note gets a fragment added by its reviewer, which answers the check by itself."

      - name: Note what answered it
        if: steps.decide.outputs.verdict == 'not-applicable'
        run: |
          echo "::notice::Every file changed here is in an area that never produces a release note (compat/, tests/ and test files, docs/plans/, docs/dev/, agent and editor config, contributor docs, local tooling). The full list is EXEMPT_* in scripts/changelog-required.py."

      # The release PR writes the release notes; it does not owe one. Silent on
      # the PR itself rather than a comment, because the release PR already
      # carries the prep summary, the refresh comments and the RC comment, and
      # a fourth saying nothing happened is noise on the busiest PR in the repo.
      - name: Note that this is the release PR
        if: steps.decide.outputs.verdict == 'release-pr'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "::notice::This is the release PR for $RELEASE_VERSION — it touches only VERSION, CHANGELOG.md and the fragments it consumes, so it adds no fragment by construction. Push anything else to this branch and the check asks again."

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.app.outputs.available == 'true'
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Say so on the PR
        if: steps.app.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERDICT: ${{ steps.decide.outputs.verdict }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- overcast-changelog-gate -->';
            const verdict = process.env.VERDICT;
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };

            const { data: all } = await github.rest.issues.listComments({
              ...issue, per_page: 100,
            });
            const stale = all.filter(c => c.body && c.body.includes(marker));

            // Post first, delete second, so the PR is never briefly left
            // holding a failing check with no explanation on it.
            const replace = async (body) => {
              await github.rest.issues.createComment({ ...issue, body });
              for (const c of stale) {
                await github.rest.issues.deleteComment({
                  owner: issue.owner, repo: issue.repo, comment_id: c.id,
                });
              }
            };

            // A fragment appeared, or a release is in flight: the question is
            // answered by the diff itself, so removing the old ask is the
            // whole of the news.
            if (verdict !== 'missing' && verdict !== 'waived') {
              for (const c of stale) {
                await github.rest.issues.deleteComment({
                  owner: issue.owner, repo: issue.repo, comment_id: c.id,
                });
              }
              return;
            }

            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');
            // Every push re-runs this. Only speak when something changed — an
            // unchanged question does not need asking twice.
            if (stale.some(c => c.body.trim() === body.trim())) {
              core.info('Nothing new to say; leaving the existing comment alone.');
              return;
            }
            await replace(body);

      - name: Ask
        if: steps.decide.outputs.verdict == 'missing'
        run: |
          echo "::error::This PR adds no changelog fragment. Add one with 'python3 scripts/changelog.py new', or comment '/no-changelog <reason>' on the PR to record that it needs none. See the comment on the PR, or the job summary, for the rest."
          exit 1
