name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  vet:
    name: Vet
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

  coverage:
    name: Full test suite with coverage
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install dependencies
        run: go mod download

      - name: Full test suite with coverage
        run: |
          go test -race -count=1 -timeout=1200s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  slim:
    name: Test suite (-tags slim)
    runs-on: ubuntu-latest

    # Deliberately no `needs: web` and no download-artifact: dropping the
    # embedded SPA is the whole point of the slim build (embed_slim.go), so this
    # job needs no web/dist and can start immediately.
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet -tags slim ./...

      # AGENTS.md directs agents at `-tags slim` for backend-only verification,
      # so the slim suite has to stay green or that guidance produces false
      # positives. No -race: the tag changes which routes register and which
      # assets embed, not concurrency — the untagged coverage job owns race
      # coverage, and dropping it here roughly halves the runtime.
      - name: Test suite
        run: go test -count=1 -timeout=1200s -tags slim ./...

  sqs-protocol-dispatch:
    name: SQS integration tests (protocol dispatch)
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: SQS integration tests (protocol dispatch)
        run: OVERCAST_PROTOCOL_DISPATCH=1 go test -race -count=1 -timeout=300s ./tests/integration/sqs/...

  lint:
    name: Lint
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist
      # No install step: `make lint-go` runs golangci-lint via a pinned
      # `go run`, so CI and local runs cannot drift onto different versions.
      # The pin lives in the Makefile (GOLANGCI_LINT_VERSION).
      - name: Run Go lint
        run: make lint-go

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: rhysd/actionlint@v1.7.7

  docs-check:
    name: Docs and capability registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make docs-check

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.0
      # No setup-go: the docs index is committed, so the SPA build no longer
      # shells out to the Go generator. This job is Node-only.
      # pnpm/action-setup must precede setup-node: `cache: pnpm` resolves the
      # store path by running pnpm, so pnpm has to be on PATH by then.
      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      # Not `tsc --noEmit`: that resolves web/tsconfig.json, a
      # solution-style config with "files": [] and only project references, so
      # it compiles zero files and always passes. `pnpm run typecheck` runs
      # tsconfig.app.json and tsconfig.node.json explicitly.
      - name: Type check
        run: pnpm run typecheck
      # Runs before the build so a test failure is attributable to this step
      # rather than surfacing (or not) somewhere inside the build.
      - name: Unit tests
        run: pnpm run test
      # `pnpm run build` re-runs typecheck. That duplication is deliberate: the
      # dedicated step above gives an attributable failure, and invoking the
      # published script keeps CI from drifting from what contributors run
      # locally.
      - name: Build SPA
        run: VITE_BUNDLED=true pnpm run build
      - name: Build BFF server
        run: pnpm run build:server
      - name: Upload web assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  cross-build:
    name: Cross-build ${{ matrix.asset }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: overcast-linux-amd64
            goos: linux
            goarch: amd64
            tags: ""
          - asset: overcast-linux-arm64
            goos: linux
            goarch: arm64
            tags: ""
          - asset: overcast-darwin-amd64
            goos: darwin
            goarch: amd64
            tags: ""
          - asset: overcast-darwin-arm64
            goos: darwin
            goarch: arm64
            tags: ""
          - asset: overcast-windows-amd64.exe
            goos: windows
            goarch: amd64
            tags: ""
          - asset: overcastd-linux-amd64
            goos: linux
            goarch: amd64
            tags: slim,nosqlite
          - asset: overcastd-linux-arm64
            goos: linux
            goarch: arm64
            tags: slim,nosqlite
          - asset: overcastd-darwin-amd64
            goos: darwin
            goarch: amd64
            tags: slim,nosqlite
          - asset: overcastd-darwin-arm64
            goos: darwin
            goarch: arm64
            tags: slim,nosqlite
          - asset: overcastd-windows-amd64.exe
            goos: windows
            goarch: amd64
            tags: slim,nosqlite
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist
      - uses: ./.github/actions/build-overcast-binary
        with:
          asset: ${{ matrix.asset }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          tags: ${{ matrix.tags }}
          version: ci

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: console
            tag: overcast:ci
            target: ""
          - image: slim
            tag: overcast-slim:ci
            target: slim
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build image
        env:
          TAG: ${{ matrix.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(-t "$TAG")
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          docker build "${args[@]}" .
      - name: Smoke test (slim)
        if: matrix.image == 'slim'
        run: |
          docker run -d --name oc-smoke -p 4566:4566 ${{ matrix.tag }}
          sleep 2
          curl -sf http://localhost:4566/_health
          docker rm -f oc-smoke
