name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  vet:
    name: Vet
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

  coverage:
    name: Full test suite with coverage
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install dependencies
        run: go mod download

      - name: Full test suite with coverage
        run: |
          go test -race -count=1 -timeout=1200s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  build-tags:
    name: Test suite (-tags ${{ matrix.tags }})
    runs-on: ubuntu-latest

    # Deliberately no `needs: web` and no download-artifact: dropping the
    # embedded SPA is the whole point of the slim build (embed_slim.go), so this
    # job needs no web/dist and can start immediately.
    strategy:
      fail-fast: false
      matrix:
        # `slim` is what AGENTS.md tells agents to use for backend-only
        # verification; `slim,nosqlite` is what actually ships — both the
        # released overcastd binary (the cross-build matrix below) and the slim
        # Docker image (`build-slim` in the Makefile) are built with it. Gating
        # only the untagged suite left the shipped tag set ungated.
        tags: [slim, "slim,nosqlite"]

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet -tags ${{ matrix.tags }} ./...

      # No -race: these tags change which routes register, which assets embed,
      # and whether SQLite is compiled in — not concurrency. The untagged
      # coverage job owns race coverage, and dropping it here roughly halves
      # the runtime.
      - name: Test suite
        run: go test -count=1 -timeout=1200s -tags ${{ matrix.tags }} ./...

  sqs-protocol-dispatch:
    name: SQS integration tests (protocol dispatch)
    needs: web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: SQS integration tests (protocol dispatch)
        run: OVERCAST_PROTOCOL_DISPATCH=1 go test -race -count=1 -timeout=300s ./tests/integration/sqs/...

  lint:
    name: Lint
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: web-dist
          path: web/dist
      # No install step: `make lint-go` runs golangci-lint via a pinned
      # `go run`, so CI and local runs cannot drift onto different versions.
      # The pin lives in the Makefile (GOLANGCI_LINT_VERSION).
      - name: Run Go lint
        run: make lint-go

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: rhysd/actionlint@v1.7.7

  # The repo's helper scripts carry unittest files next to them; they are cheap
  # and guard logic CI depends on (the compat report's JUnit mapping decides
  # whether a check run goes red).
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Run script unit tests
        run: |
          status=0
          for t in scripts/*_test.py; do
            echo "── $t"
            python3 "$t" || status=1
          done
          exit "$status"

  docs-check:
    name: Docs and capability registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make docs-check

  compat-registry:
    name: Compat registry schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Validate compat registry against its schema
        run: python3 scripts/validate-compat-registry.py

  aws-operation-coverage:
    name: AWS operation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate generated operation ownership
        run: make aws-models-check

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.0
      # No setup-go: the docs index is committed, so the SPA build no longer
      # shells out to the Go generator. This job is Node-only.
      # pnpm/action-setup must precede setup-node: `cache: pnpm` resolves the
      # store path by running pnpm, so pnpm has to be on PATH by then.
      - uses: pnpm/action-setup@v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      # Not `tsc --noEmit`: that resolves web/tsconfig.json, a
      # solution-style config with "files": [] and only project references, so
      # it compiles zero files and always passes. `pnpm run typecheck` runs
      # tsconfig.app.json and tsconfig.node.json explicitly.
      - name: Type check
        run: pnpm run typecheck
      # Runs before the build so a test failure is attributable to this step
      # rather than surfacing (or not) somewhere inside the build.
      - name: Unit tests
        run: pnpm run test
      # `pnpm run build` re-runs typecheck. That duplication is deliberate: the
      # dedicated step above gives an attributable failure, and invoking the
      # published script keeps CI from drifting from what contributors run
      # locally.
      - name: Build SPA
        run: VITE_BUNDLED=true pnpm run build
      - name: Build BFF server
        run: pnpm run build:server
      - name: Upload web assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # release-gate decides, once, whether this build is a release candidate:
  # a same-repo PR whose checked-out VERSION has no v<VERSION> tag yet. That
  # covers the PR that bumps VERSION and — where a release/* branch-name test
  # would go blind — a follow-up PR after a failed release workflow, when the
  # unreleased version already sits on main. The script never fails (errors
  # degrade to rc=false with a warning), so the jobs that hang off this output
  # cannot be skip-cascaded by an infrastructure hiccup.
  release-gate:
    name: Release candidate gate
    runs-on: ubuntu-latest
    outputs:
      rc: ${{ steps.check.outputs.rc }}
    steps:
      - uses: actions/checkout@v7.0.0
      - id: check
        env:
          IS_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          rc=false
          if [ "$IS_SAME_REPO_PR" = "true" ]; then
            rc=$(bash scripts/release-candidate-check.sh)
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "release candidate: $rc"

  # The binary set is defined once in build-binaries.yml and shared with
  # release.yml, so the PR check builds exactly what a release would ship.
  # On a release-candidate build the binaries are also uploaded as artifacts;
  # on every other PR this stays a pure build check.
  cross-build:
    name: Cross-build
    needs: [web, release-gate]
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ci
      upload-artifacts: ${{ needs.release-gate.outputs.rc == 'true' }}
      retention-days: 14

  docker:
    name: Docker build (${{ matrix.image }})
    needs: release-gate
    runs-on: ubuntu-latest
    # contents: read restates the default that adding a job-level block would
    # otherwise drop; packages: write is exercised only on same-repo release
    # PRs, where the freshly built image is pushed as a release candidate.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: console
            tag: overcast:ci
            target: ""
          - image: slim
            tag: overcast-slim:ci
            target: slim
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Build image
        env:
          TAG: ${{ matrix.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(-t "$TAG")
          if [[ -n "$TARGET" ]]; then
            args+=(--target "$TARGET")
          fi
          docker build "${args[@]}" .
      - name: Smoke test (slim)
        if: matrix.image == 'slim'
        run: |
          docker run -d --name oc-smoke -p 4566:4566 ${{ matrix.tag }}
          sleep 2
          curl -sf http://localhost:4566/_health
          docker rm -f oc-smoke
      # On a release PR, publish this exact image to GHCR as a release
      # candidate: {version}-rc.{run_number}. run_number increments per CI
      # run, so every push to the release branch mints a fresh RC and earlier
      # ones stay pullable for comparison. linux/amd64 only — the multi-arch
      # manifest is built at publish time; the RC exists so the candidate
      # bits themselves can be smoke tested before stamping.
      - name: Push release-candidate image
        id: rc-push
        if: needs.release-gate.outputs.rc == 'true'
        env:
          IMAGE_SUFFIX: ${{ matrix.image == 'slim' && '-slim' || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_TAG: ${{ matrix.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=$(cat VERSION)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          rc_image="ghcr.io/${owner}/overcast${IMAGE_SUFFIX}:${version}-rc.${RUN_NUMBER}"
          docker tag "$SOURCE_TAG" "$rc_image"
          docker push "$rc_image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$rc_image")
          mkdir -p rc-meta
          {
            echo "$rc_image"
            echo "$digest"
          } > "rc-meta/rc-image-${{ matrix.image }}.txt"
      - name: Record release-candidate image reference
        if: steps.rc-push.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rc-image-${{ matrix.image }}
          path: rc-meta/rc-image-${{ matrix.image }}.txt
          retention-days: 14

  # rc-comment maintains one bot comment on a release PR — release-notes
  # shaped: the RC images with pull commands and digests, and a table of the
  # binary artifacts — so the candidate CI built is one click away. The
  # comment is updated in place on every build rather than posted again.
  rc-comment:
    name: Release candidate summary
    needs: [release-gate, cross-build, docker]
    if: needs.release-gate.outputs.rc == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: rc-image-*
          path: rc-meta
          merge-multiple: true
      - name: Upsert RC comment
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- overcast-rc-build -->';

            const images = [];
            for (const image of ['console', 'slim']) {
              const f = `rc-meta/rc-image-${image}.txt`;
              if (fs.existsSync(f)) {
                const [ref, withDigest] = fs.readFileSync(f, 'utf8').trim().split(/\r?\n/);
                images.push({ ref, digest: (withDigest || '').split('@')[1] || '' });
              }
            }

            const { data: arts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId, per_page: 100,
            });
            const mb = (n) => (n / (1024 * 1024)).toFixed(1) + ' MB';
            const binaries = arts.artifacts
              .filter(a => a.name.startsWith('overcast'))
              .sort((a, b) => a.name.localeCompare(b.name));

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha;
            const rcName = images[0] ? images[0].ref.split(':').pop() : `rc.${context.runNumber}`;

            let body = `${marker}\n## Release candidate \`${rcName}\`\n\n`;
            body += `Built from ${sha} — [workflow run](${runUrl}). `;
            body += `Every push to this branch mints a new RC; earlier RCs stay pullable.\n\n`;
            body += `### Images (linux/amd64)\n\n`;
            for (const i of images) {
              body += '```\ndocker pull ' + i.ref + '\n```\n';
              if (i.digest) body += `<sub>digest \`${i.digest}\`</sub>\n\n`;
            }
            body += `### Binaries\n\n| Asset | Size |\n| --- | --- |\n`;
            for (const a of binaries) {
              body += `| [${a.name}](${runUrl}#artifacts) | ${mb(a.size_in_bytes)} |\n`;
            }
            body += `\n<sub>Binary artifacts expire after 14 days. RC image tags are transient pre-release builds.</sub>\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
