services:
  overcast:
    build: .
    # Compose cannot run scripts/image-tag.sh to derive a per-branch tag the way
    # the Makefile and Taskfile do, so this keeps `dev` as the default and reads
    # OVERCAST_IMAGE_TAG when you want to point it at a branch build:
    #   OVERCAST_IMAGE_TAG=$(sh scripts/image-tag.sh) docker compose up
    # Left unset it builds and tags overcast:dev exactly as it always has.
    image: overcast:${OVERCAST_IMAGE_TAG:-dev}
    container_name: overcast
    ports:
      - "4566:4566"
      - "4567:4567"
    environment:
      OVERCAST_PORT: "4566"
      OVERCAST_STATE: memory # change to 'sqlite' for persistence
      OVERCAST_DATA_DIR: /data
      OVERCAST_LOG_LEVEL: debug
      OVERCAST_DEFAULT_REGION: us-east-1
      OVERCAST_ACCOUNT_ID: "000000000000"
      # OVERCAST_SIGV4_VALIDATE: "false"  # TODO: set to true once implemented
    volumes:
      # Persist SQLite data across container restarts when STATE=sqlite.
      # Has no effect when STATE=memory.
      - overcast-data:/data
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4566/_health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

volumes:
  overcast-data:
