services:
  overcast:
    build: .
    # Compose cannot run scripts/image-tag.sh to derive a per-branch tag the way
    # the Makefile and Taskfile do, so this keeps `dev` as the default and reads
    # OVERCAST_IMAGE_TAG when you want to point it at a branch build:
    #   OVERCAST_IMAGE_TAG=$(sh scripts/image-tag.sh) docker compose up
    # Left unset it builds and tags overcast:dev exactly as it always has.
    image: overcast:${OVERCAST_IMAGE_TAG:-dev}
    container_name: overcast
    ports:
      - "4566:4566"
      - "4567:4567"
    environment:
      OVERCAST_PORT: "4566"
      OVERCAST_STATE: memory # change to 'sqlite' for persistence
      OVERCAST_DATA_DIR: /data
      OVERCAST_LOG_LEVEL: debug
      OVERCAST_DEFAULT_REGION: us-east-1
      OVERCAST_ACCOUNT_ID: "000000000000"
      # OVERCAST_SIGV4_VALIDATE: "false"  # TODO: set to true once implemented
      # Where the local CA lives. Kept OFF /data deliberately: state is
      # disposable and per-environment, a CA is a trust anchor you installed
      # into this machine's trust store once. Pointing them at the same volume
      # means `down -v` costs you a root-certificate re-approval.
      OVERCAST_CA_DIR: /ca
    volumes:
      # Persist SQLite data across container restarts when STATE=sqlite.
      # Has no effect when STATE=memory.
      - overcast-data:/data
      # The CA, on its own volume so it survives `down`, recreation and image
      # upgrades. Better still for HTTPS: create the CA on the host once
      # (`overcast https enable`) and mount it read-only, so every environment
      # on this machine shares the one root you approved —
      #   - ~/.overcast/data/ca:/ca:ro
      - overcast-ca:/ca
    healthcheck:
      # Mirrors the Dockerfile's HEALTHCHECK, https first (see the reasoning
      # there): a compose healthcheck REPLACES the image's, so an http-only
      # probe here marks the container unhealthy for the whole life of an
      # OVERCAST_TLS=auto run. --no-check-certificate is fine — this is a
      # liveness probe against our own loopback, not a trust decision.
      test: [ "CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:4566/_overcast/health || wget -qO- http://localhost:4566/_overcast/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

volumes:
  overcast-data:
  overcast-ca:
