# docker-compose.dev.yml
#
# Development server with live source mounting.
# The binary is built INSIDE the container but reads source from your host.
# Use this if you prefer not to use the VS Code Dev Container.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# Workflow:
#   1. Make code changes on your host (Windows/Mac/Linux)
#   2. The `build` service compiles inside Linux — no local Go needed
#   3. The `overcast` service runs the freshly built binary
#   4. Port 4566 is forwarded — your AWS SDK / CLI on the host hits the container
#
# To rebuild after changes:
#   docker compose -f docker-compose.dev.yml up --build
#
# If you last ran this before the module-cache ownership fix in
# .devcontainer/Dockerfile, the go-mod-cache volume still carries the root
# ownership Docker gave it, and the build fails with
# "mkdir /home/vscode/go/pkg/mod/cache: permission denied". Drop it once:
#   docker compose -f docker-compose.dev.yml down -v
#
# Neither service declares an `image:`, so Compose names what it builds after
# the project (the directory) and the service. That is already per-worktree, so
# there is nothing here to give a per-branch tag the way the Makefile and
# Taskfile targets do — see CONTRIBUTING.md § Docker image tags are per-branch.
#
# To run tests:
#   make container-test          (or: task container-test)
#
# Prefer those over `docker compose -f docker-compose.dev.yml run --rm test`:
# they go through scripts/container-test.sh, which bounds the container's CPU
# use. See the `test` service's comments below.

services:

  # Run all tests inside the container against the mounted source.
  # Usage: docker compose -f docker-compose.dev.yml run --rm test
  test:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    # CPU bound. Uncapped, this service takes the whole machine, the same way
    # the Go-in-Docker wrappers used to (CONTRIBUTING.md § "No local Go
    # toolchain?" has the measurements). A Compose file can only carry a literal
    # or a ${VAR}, and the cap has to be derived from the host at run time —
    # `--cpus=N` is rejected outright when N exceeds the CPUs the daemon
    # reports, so a hardcoded number would break smaller machines. And
    # `docker compose run` has no --cpus flag of its own. So the number is
    # computed by scripts/container-test.sh (or its .ps1 twin) and arrives here
    # as an environment variable; `make container-test` and `task container-test`
    # route through it.
    #
    # Left unset the substitution yields 0, which Compose treats as "no limit"
    # and the Go runtime ignores, so a bare `docker compose run --rm test`
    # behaves exactly as it always has.
    cpus: ${OVERCAST_GO_CPUS:-0}
    volumes:
      - type: bind
        source: .
        target: /workspace
        # 'cached' consistency: host → container writes are buffered.
        # Fastest option for read-heavy workloads like `go test`.
        consistency: cached
    environment:
      # The race detector needs cgo. With CGO_ENABLED=0 the command below fails
      # outright: "go: -race requires cgo; enable cgo by setting CGO_ENABLED=1".
      CGO_ENABLED: "1"
      # Has to be set by hand to match cpus:. Container-aware GOMAXPROCS — the
      # runtime reading the cgroup CPU quota — arrived in Go 1.25, and this image
      # is golang:1.24-bookworm, so the cap alone would leave the runtime seeing
      # every host core and thrashing on context switches instead of running
      # slower cleanly.
      GOMAXPROCS: ${OVERCAST_GO_CPUS:-0}
      # -p bounds concurrent test *binaries* and defaults to GOMAXPROCS; each
      # binary then inherits GOMAXPROCS, so leaving it alone squares the
      # parallelism. It rides GOFLAGS rather than the command below so it still
      # applies when a caller overrides the command. Must be empty or a positive
      # integer: `go test -p 0` is an error, so "no -p" is spelled as unset.
      GOFLAGS: ${OVERCAST_GO_TEST_P:+-p=${OVERCAST_GO_TEST_P}}
    command: go test -race -count=1 -timeout=120s ./...
    # No port mapping — this is a one-shot test runner.

    # Build and run the server with source mounted for development.
  overcast:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    ports:
      - "4566:4566"
    volumes:
      - type: bind
        source: .
        target: /workspace
        consistency: cached
      # Separate volume for the compiled binary so it doesn't pollute
      # the host source tree and avoids Windows/Linux binary incompatibility.
      #
      # Deliberately OUTSIDE /workspace. /workspace is a bind mount of the host
      # source, and a bind mount hides whatever the image placed at that path,
      # so a named volume nested under it is created root-owned and the vscode
      # user cannot write the binary into it. /home/vscode/bin is created and
      # chowned in .devcontainer/Dockerfile, so the volume inherits that.
      - overcast-bin:/home/vscode/bin
      # Module cache: reused across rebuilds for fast dependency resolution.
      - go-mod-cache:/home/vscode/go/pkg/mod
    environment:
      OVERCAST_PORT: "4566"
      OVERCAST_STATE: memory
      OVERCAST_LOG_LEVEL: debug
      OVERCAST_DEBUG: "true"
      CGO_ENABLED: "0"
    # Build then run in one command. The binary is rebuilt on every `up --build`.
    command: >
      sh -c "
        go build -trimpath -ldflags='-w -s' -o /home/vscode/bin/overcast ./cmd/overcast &&
        /home/vscode/bin/overcast serve
      "
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4566/_health" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  overcast-bin:
  go-mod-cache:
