# compat/docker-compose.yml
#
# Cross-platform compat test runner. Requires only Docker — no local Go,
# Node.js, or any other toolchain.
#
# Usage (from repo root):
#   docker compose -f compat/docker-compose.yml run --rm compat
#
# CI (GitHub Actions etc.):
#   - name: Run compat tests
#     run: docker compose -f compat/docker-compose.yml run --rm compat
#
# Configuration via environment variables (all optional):
#   OVERCAST_COMPAT_SKIP_DOCKER=1   Skip tests that need a Docker daemon
#                                   (Lambda invocation). Default 0: the host
#                                   socket is mounted, so containers are
#                                   siblings on the host daemon, not nested.
#   COMPAT_DOCKER_SOCK=…            Host Docker socket path, if not the
#                                   default /var/run/docker.sock.
#   COMPAT_DOCKER_GID=…             Group that owns the Docker socket. The
#                                   default, 0, is right for Docker Desktop
#                                   (root:root). Native Linux needs the docker
#                                   group's gid:
#                                     COMPAT_DOCKER_GID=$(stat -c %g /var/run/docker.sock)
#                                   The runner joins that group rather than
#                                   chgrp'ing the socket, which is shared with
#                                   the overcast container — see the group_add
#                                   comment on the compat service.
#   OVERCAST_LOG_LEVEL=info         Overcast log verbosity (default: warn).
#   OVERCAST_RDS_MODE=live          Run real database engine containers. The
#                                   default here is mock — see the overcast
#                                   service below and issue #614.
#   OVERCAST_COMPAT_FORMAT=json     Go runner output format: pretty|json
#                                   (default: pretty).
#   OVERCAST_COMPAT_SUITE=go-sdk    Optional comma-separated suite filter.

services:
  # ── Overcast emulator ─────────────────────────────────────────────────────
  overcast:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "4566" # internal only — compat service reaches it via the network
    volumes:
      # Lambda, ECS, ElastiCache and MSK run real containers. Without the
      # host daemon those services are metadata-only and every invocation
      # returns a stub, so the suites measure the stub rather than Overcast.
      # RDS could too, but is held at mock here — see OVERCAST_RDS_MODE below.
      - ${COMPAT_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      OVERCAST_PORT: "4566"
      OVERCAST_STATE: memory
      OVERCAST_LOG_LEVEL: ${OVERCAST_LOG_LEVEL:-warn}
      # RDS stays metadata-only for the same reason CI does: `available` means
      # the engine answered, and a real MySQL first boot per instance is more
      # than the compat run can absorb. Override to `live` to exercise the
      # container path locally. Issue #614 tracks getting compat back to live.
      OVERCAST_RDS_MODE: ${OVERCAST_RDS_MODE:-mock}
      # The suites reach this container as "overcast", and the CDK asset
      # publisher addresses S3 buckets virtual-hosted ("{bucket}.overcast").
      # Registering the compose hostname as a virtual-host base is what lets
      # host classification put the bucket subdomain back in front of the
      # path (pairs with the /etc/hosts entry in the runner services below).
      OVERCAST_HOSTNAME: overcast
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4566/_overcast/health"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  # ── Go compat runner (CLI) ────────────────────────────────────────────────
  # Builds the Overcast repo with Go, then runs:
  #   go run ./cmd/compat --endpoint http://overcast:4566
  compat:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - type: bind
        source: ..
        target: /workspace
        consistency: cached
      # Module and build caches so repeated runs don't re-download modules or
      # recompile the whole tree — a cold build of ./cmd/compat is minutes, a
      # warm one seconds. Both paths are pre-created and user-owned in the
      # image; see .devcontainer/Dockerfile.
      - go-mod-cache:/home/vscode/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      # The host Docker socket, so the suites that build and run their own
      # images (java-sdk, dotnet-sdk, rust-sdk, cdk) can drive the host daemon.
      # Their runners already detect /.dockerenv and join this container's
      # network namespace, so the sibling they start reaches `overcast` on the
      # compose network. This grants the container control of the host daemon —
      # the same trust the dev container and `make docker-run` already assume.
      - ${COMPAT_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Keep container installs out of the bind mount. node_modules holds
      # platform-specific binaries, so sharing these directories with the host
      # leaves whichever side installed last with a tree the other cannot run.
      - node-js-sdk-modules:/workspace/compat/suites/node-js-sdk/node_modules
      - cdk-modules:/workspace/compat/suites/cdk/node_modules
    environment:
      CGO_ENABLED: "0"
      OVERCAST_ENDPOINT: http://overcast:4566
      OVERCAST_COMPAT_SKIP_DOCKER: ${OVERCAST_COMPAT_SKIP_DOCKER:-0}
      OVERCAST_COMPAT_FORMAT: ${OVERCAST_COMPAT_FORMAT:-pretty}
      OVERCAST_COMPAT_SUITE: ${OVERCAST_COMPAT_SUITE:-}
    # Join the Docker socket's group rather than changing the socket to ours.
    # This used to be `chgrp "$(id -g)" /var/run/docker.sock` in the command
    # below, which works but mutates a bind mount **shared with the overcast
    # container** — and the overcast entrypoint reads the socket's gid once, at
    # its own start, to decide which group to put its user in. Since compose
    # starts overcast first (depends_on: service_healthy), the chgrp landed
    # after that decision and silently revoked overcast's access. Every
    # Lambda-backed test then failed with "the function is in a failed state",
    # nineteen tests deep and nowhere near the cause, and the only cure was
    # restarting overcast so its entrypoint re-derived the new gid.
    # group_add is applied by Docker at container creation, changes nothing
    # outside this container, and cannot race anyone.
    # 0 covers Docker Desktop, whose socket is root:root. On native Linux the
    # socket is root:docker, so pass the gid:
    #   COMPAT_DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose ...
    group_add:
      - "${COMPAT_DOCKER_GID:-0}"
    depends_on:
      overcast:
        condition: service_healthy
    # Install suite prerequisites, then run the compat CLI.
    #
    # chown first: Docker creates a named volume's mountpoint as root when the
    # path does not exist in the image, and these live under the bind-mounted
    # workspace, so they always start root-owned and npm cannot write to them.
    # The image gives vscode passwordless sudo for exactly this kind of fixup.
    #
    # npm: node-js-sdk and cdk are both TypeScript suites. A full `npm ci` only
    # when the volume is empty — it deletes and reinstalls the tree, which is
    # minutes on every container start otherwise. A populated volume takes
    # `npm install`, which is a no-op when the tree already matches the
    # lockfile and repairs it when it does not. The installs run concurrently
    # (separate prefixes, and npm's cache is safe for concurrent use), so the
    # dashboard comes up in the time of the slowest one rather than their sum.
    # pip: --break-system-packages because Debian marks its Python externally
    # managed (PEP 668); this is a throwaway container, so system-wide is fine.
    # go-sdk, cli: 'go run' handles deps automatically.
    #
    # /etc/hosts: the CDK asset publisher addresses the bootstrap bucket
    # virtual-hosted ("cdk-hnb659fds-assets-….overcast"), and Docker's DNS has
    # no wildcard subdomains for service aliases, so cdk deploys fail with
    # ENOTFOUND on any asset upload. The bucket name is deterministic
    # (fixed account + region), so one hosts entry pointing it at the
    # overcast service fixes the compose path; CI is unaffected — it targets
    # localhost, whose subdomains already resolve.
    #
    # A suite whose dependencies fail to install must not abort the run — it
    # reports as a failing suite, which is the honest result.
    command:
      - sh
      - -c
      - >
        sudo -n chown vscode:vscode compat/suites/node-js-sdk/node_modules compat/suites/cdk/node_modules;
        test -r /var/run/docker.sock -a -w /var/run/docker.sock || echo "compat: Docker socket not usable (gid $$(stat -c %g /var/run/docker.sock 2>/dev/null || echo none), our groups $$(id -G)) — set COMPAT_DOCKER_GID to the socket's gid; java-sdk, dotnet-sdk, rust-sdk and cdk will not run" >&2;
        getent hosts overcast | awk '{print $$1 " cdk-hnb659fds-assets-000000000000-us-east-1.overcast"}' | sudo -n tee -a /etc/hosts >/dev/null || echo "compat: could not add CDK asset-bucket hosts entry" >&2;
        for d in compat/suites/node-js-sdk compat/suites/cdk; do ( if [ -z "$$(ls -A $$d/node_modules)" ]; then npm ci --prefix "$$d" --silent; else npm install --prefix "$$d" --silent --no-audit --no-fund; fi || echo "compat: $$d dependencies failed to install" >&2 ) & done;
        ( pip install --break-system-packages --quiet -r compat/suites/python-sdk/requirements.txt || echo "compat: python-sdk dependencies failed to install" >&2 ) &
        wait;
        exec go run ./cmd/compat --endpoint http://overcast:4566 --format "$${OVERCAST_COMPAT_FORMAT:-pretty}" $${OVERCAST_COMPAT_SUITE:+--suite "$$OVERCAST_COMPAT_SUITE"}

  # ── Compat dashboard (containerised) ──────────────────────────────────────
  # The only path to the dashboard that needs no host toolchain at all — not
  # Go, not Node. Start it with:
  #   docker compose -f compat/docker-compose.yml up dashboard
  # then open http://localhost:${COMPAT_PORT:-7777}. Tests run on demand from
  # the dashboard. The published port is the one thing compose cannot pick for
  # you: set COMPAT_PORT if 7777 is taken.
  dashboard:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    ports:
      - "${COMPAT_PORT:-7777}:7777"
    volumes:
      - type: bind
        source: ..
        target: /workspace
        consistency: cached
      - go-mod-cache:/home/vscode/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      # The host Docker socket, so the suites that build and run their own
      # images (java-sdk, dotnet-sdk, rust-sdk, cdk) can drive the host daemon.
      # Their runners already detect /.dockerenv and join this container's
      # network namespace, so the sibling they start reaches `overcast` on the
      # compose network. This grants the container control of the host daemon —
      # the same trust the dev container and `make docker-run` already assume.
      - ${COMPAT_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # See the compat service above: node_modules must not be shared with the
      # host, and the dashboard UI is built in here too.
      - node-js-sdk-modules:/workspace/compat/suites/node-js-sdk/node_modules
      - cdk-modules:/workspace/compat/suites/cdk/node_modules
      - compat-ui-modules:/workspace/compat/ui/node_modules
      # The UI build output is a volume too, so the container never writes into
      # the host's working tree — Vite empties this directory on every build,
      # and a container-written dist/ is unremovable from the host side (and
      # vice versa) once the two disagree about ownership.
      - compat-ui-dist:/workspace/compat/ui/dist
    environment:
      CGO_ENABLED: "0"
      # Target the overcast service this file already starts and waits on, the
      # same way the compat service does. Without it the endpoint is unpinned,
      # so the runner starts an instance of its own: a sibling container on the
      # host daemon, published on the *host's* loopback and so absent from this
      # container's network namespace, which the runner then polls for a health
      # check that can never answer — or, if a Linux bin/overcast happens to be
      # in the bind mount, a second in-container emulator that duplicates the
      # one next door. depends_on and the CDK asset-bucket hosts entry below
      # were always written for the shared service; this is what uses it.
      OVERCAST_ENDPOINT: http://overcast:4566
      OVERCAST_COMPAT_SKIP_DOCKER: ${OVERCAST_COMPAT_SKIP_DOCKER:-0}
    # See the compat service above for why this replaces a chgrp of the shared
    # socket. Same reasoning, same override.
    group_add:
      - "${COMPAT_DOCKER_GID:-0}"
    depends_on:
      overcast:
        condition: service_healthy
    # Same preparation as the compat service above (see its comment for why the
    # chown and the npm ci/install split are there), plus compat/ui — which
    # --build-ui installs and builds itself. Dependency installs are
    # best-effort: a suite that cannot install still shows up in the dashboard
    # as an errored suite, which is more useful than no dashboard at all.
    command:
      - sh
      - -c
      - >
        sudo -n chown vscode:vscode compat/ui/node_modules compat/ui/dist compat/suites/node-js-sdk/node_modules compat/suites/cdk/node_modules;
        test -r /var/run/docker.sock -a -w /var/run/docker.sock || echo "compat: Docker socket not usable (gid $$(stat -c %g /var/run/docker.sock 2>/dev/null || echo none), our groups $$(id -G)) — set COMPAT_DOCKER_GID to the socket's gid; java-sdk, dotnet-sdk, rust-sdk and cdk will not run" >&2;
        getent hosts overcast | awk '{print $$1 " cdk-hnb659fds-assets-000000000000-us-east-1.overcast"}' | sudo -n tee -a /etc/hosts >/dev/null || echo "compat: could not add CDK asset-bucket hosts entry" >&2;
        touch compat/ui/dist/.gitkeep;
        for d in compat/suites/node-js-sdk compat/suites/cdk; do ( if [ -z "$$(ls -A $$d/node_modules)" ]; then npm ci --prefix "$$d" --silent; else npm install --prefix "$$d" --silent --no-audit --no-fund; fi || echo "compat: $$d dependencies failed to install" >&2 ) & done;
        ( pip install --break-system-packages --quiet -r compat/suites/python-sdk/requirements.txt || echo "compat: python-sdk dependencies failed to install" >&2 ) &
        wait;
        exec go run ./cmd/compat --endpoint http://overcast:4566 --serve --interactive --build-ui --port :7777
    # The first start compiles the CLI and builds the UI, so give it room; once
    # the caches are warm a restart is seconds. `up --wait` blocks on this.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7777/suites"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 300s

volumes:
  go-mod-cache:
  go-build-cache:
  node-js-sdk-modules:
  cdk-modules:
  compat-ui-modules:
  compat-ui-dist:
