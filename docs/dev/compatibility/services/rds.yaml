service: rds
status: in_progress
priority: p1
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-08-14
protocols: [query]
implementation: [internal/services/rds]
integration_tests: [tests/integration/rds]
capability_docs: docs/services/rds.md
operation_count_estimate: 33 supported
current_support_level: DB instances, Aurora clusters, subnet/parameter groups, snapshots, logs, and tagging supported; Docker-backed where possible.
operations:
  CreateDBParameterGroup:
    status: reviewed
    scenarios:
      - name: Aurora MySQL 3 instance parameter group family
        status: fixed
        tests: [TestCreateDBParameterGroup_auroraMySQL8Family, rds-parameter-groups/CreateDBParameterGroup]
        evidence: >-
          CreateDBParameterGroup accepts aurora-mysql8.0 and echoes that family through the AWS Query response.
          AWS documents aurora-mysql8.0 for Aurora MySQL version 3 at
          https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.setting-capacity.html
          and directs callers to discover valid families through DescribeDBEngineVersions at
          https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateDBParameterGroup.html.
      - name: Unknown parameter group family
        status: reviewed
        tests: [TestCreateDBParameterGroup_unknownFamily]
        evidence: Families absent from DescribeDBEngineVersions remain rejected with InvalidParameterValue.
  CreateDBInstance:
    status: in_progress
    scenarios:
      - name: Lambda container DNS for DB instance endpoint
        status: fixed
        tests: [TestEndpointAliases_dbInstance, TestEndpointAliases_dbInstancePreservesCanonicalNameWhenEndpointIsIP]
        evidence: Docker-backed DB instance containers now register the advertised Endpoint.Address hostname as a Docker DNS alias on the Lambda network so Lambda execution containers can resolve endpoint hostnames.
      - name: Runtime and startup reconciliation after engine-container drift
        status: fixed
        tests: [TestHandleContainerEvent_recoversDockerLevelStop, TestHandleContainerEvent_coalescesDuplicateRecoveryEvents, TestHandleContainerEvent_stopsRestartingAfterRecoveryBudget, TestDockerRecoveryBackoff, TestDockerRecoveryBudget_resetsOnlyAfterStableAvailability, TestDockerRecoveryBudget_recognizesPersistedStabilityAfterRestart, TestReconcileContainers_reconcilesMissedStop, TestReconcileContainers_retriesRecoveryInterruptedByDaemonShutdown, TestHandleContainerStarted_preservesExplicitStop, TestHandleContainerEvent_ignoresOvercastShutdown, TestReconcileContainers_rebuildsMissingAvailableInstance, TestReconcileContainers_rebuildsMissingExternallyStoppedInstance, TestReconcileContainers_restartsExitedContainerForAvailableInstance, TestReconcileContainers_leavesExplicitlyStoppedInstanceStopped, TestReconcileContainers_stopsDockerStartedExplicitlyStoppedInstance]
        evidence: Docker-level stops and crashes are recovered with bounded exponential backoff, duplicate die events are coalesced, and repeated crash loops settle to failed after five attempts unless the engine remains available for a two-minute stability period. Missed changes are reconciled when the Docker event stream reconnects, and startup rebuilds missing or exited containers. Only StopDBInstance establishes a durable stop; reconciliation stops a container started out of band for such an instance.
      - name: Master-account initialization and initial database semantics
        status: fixed
        tests: [TestMasterUser_realAuroraMySQLCanBootstrapDatabaseAndUser, TestMasterUser_realPostgresHasRDSSuperuserSemantics, TestCreateAuroraMySQL3Container_bootstrapsAWSMasterCredentialsBeforeStart, TestCredentialInitializersGiveEveryRequestedMasterAWSBootstrapPrivileges, TestMySQLMasterAccountSpec_engineVersionSemantics, TestCreateMySQLContainer_withoutDBNameDoesNotCreateTestDatabase, TestCreateDBInstance_auroraMemberUsesClusterOwnedSettings, TestValidateMasterUserPassword]
        evidence: >-
          Docker-backed Aurora MySQL and PostgreSQL tests connect as the requested master and create databases and users. MySQL-family privileges and roles vary by the selected AWS engine version; PostgreSQL exposes a non-superuser master with the documented rds_superuser memberships. Readiness waits for completed initialization and the final engine server without depending on mutable master credentials, and a SQL-side password change survives stop/start. Aurora members always use cluster-owned credentials, engine version, port, database, and subnet placement. Password and identifier shape constraints follow the supported AWS request forms.
findings:
  fixed:
    - CreateDBParameterGroup accepts the advertised aurora-mysql8.0 family used by Aurora MySQL 3 instance parameter groups while still rejecting unknown families.
    - Docker-backed RDS DB instance endpoint hostnames are registered as Docker DNS aliases on the Lambda network.
    - Missing, crashed, or externally stopped DB instance containers are recovered with bounded backoff, after Docker reconnects, and at startup without overriding an explicit StopDBInstance; repeated crash loops settle to failed.
    - Master accounts have version-specific cross-database bootstrap privileges without exposing a remote root credential; Aurora MySQL 3 uses mysql_native_password, newer role models are represented, and PostgreSQL masters are NOSUPERUSER members of rds_superuser.
    - Initial database creation and password validation follow the supported engine's AWS-specific rules, including Aurora DatabaseName inheritance.
  remaining_gaps:
    - Review CreateDBInstance/CreateDBCluster lifecycle, validation errors, and XML response parity.
  intentionally_partial:
    - Protected internal-account enforcement and the complete catalog of AWS-managed rds_* procedures are not emulated by stock engine images.
    - PostgreSQL extension availability follows the backing image rather than AWS's RDS extension allowlist.
    - Reserved-word validation covers common SQL keywords and engine system schemas, not every version-specific engine reserved word.
handoff:
  start_with: [CreateDBInstance, CreateDBCluster, lifecycle states]
  do_not_redo: [Aurora MySQL 3 instance parameter group family, Lambda container DNS for Docker-backed RDS DB instance endpoint hostnames, runtime and startup recovery of DB instance containers, master-account initialization and initial database semantics]
  commands: [go test -count=1 ./internal/services/rds/... ./tests/integration/rds/...]
