service: lambda
status: fixed
priority: p0
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-08-14
protocols: [rest_json, event_stream]
implementation: [internal/services/lambda]
integration_tests: [tests/integration/lambda, tests/integration/lambdadocker]
capability_docs: docs/services/lambda.md
operation_count_estimate: 51 tracked; 49 supported, 2 unsupported
current_support_level: Broad control plane plus Docker-backed invoke; InvokeAsync unsupported.
operations:
  CreateFunction:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_CreateFunction.html
    protocol: REST JSON; POST /2015-03-31/functions; application/json request and response
    tests:
      - go test -count=1 -run 'TestCreateFunction_' ./tests/integration/lambda/...
      - go test -count=1 ./internal/services/lambda/...
    scenarios:
      default_zip_function:
        status: reviewed
        evidence: Existing success/default tests verify 201 response, AWS defaults Timeout=3, MemorySize=128, PackageType=Zip, and Architectures=[x86_64].
      required_fields:
        status: fixed
        evidence: Added tests for missing Code, Runtime, and Handler on Zip package functions; handler now returns InvalidParameterValueException HTTP 400.
      image_package:
        status: fixed
        evidence: Added test for PackageType=Image with Runtime; handler now rejects Runtime on image functions and requires Code.ImageUri.
      enum_and_bounds_validation:
        status: fixed
        evidence: Added tests for invalid PackageType, Timeout > 900, MemorySize < 128, and invalid Architectures; handler now returns InvalidParameterValueException HTTP 400.
      duplicate_function:
        status: reviewed
        evidence: Existing test verifies duplicate FunctionName returns ResourceConflictException HTTP 409.
      deprecated_runtime:
        status: reviewed
        evidence: Existing test verifies deprecated runtime rejection.
      publish_on_create:
        status: tests_missing
        gap: Publish=true should publish initial version 1; not reviewed in this pass.
      advanced_configuration:
        status: intentionally_partial
        gap: SnapStart, CapacityProviderConfig, DurableConfig, TenancyConfig, Publish/PublishTo, RuntimeManagementConfig, RecursiveLoop, and empty-object LoggingConfig updates are rejected before mutation rather than silently discarded. DeadLetterConfig is validated, stored, returned and honoured: a failed asynchronous invocation reaches its SQS queue or SNS topic with AWS's documented RequestID/ErrorCode/ErrorMessage message attributes, and the invocation is attempted three times as on AWS (the initial attempt plus two retries, 1s then 2s) (tests in internal/services/lambda/dead_letter_test.go, tests/integration/lambda/dead_letter_config_test.go and tests/integration/cloudformation/lambda_dead_letter_test.go). TracingConfig, EphemeralStorage and KMSKeyArn are validated against AWS's modeled constraints, stored and returned, but honoured by nothing — X-Ray is not emulated, the ephemeral storage size is not enforced on the container, and environment variables are not encrypted at rest. LoggingConfig with explicit members is stored, returned and honoured for both Text and JSON LogFormat — Text keeps the plain-text START/END/REPORT lines, JSON emits Telemetry-API-shaped platform.start, platform.runtimeDone and platform.report records and filters CloudWatch Logs and the invoke tail by SystemLogLevel and ApplicationLogLevel — alongside default or custom log groups, Architectures, VpcConfig (including Ipv6AllowedForDualStack), ImageConfig, FileSystemConfigs, and code-signing association. The init-phase platform.initStart/platform.initReport records and exact empty-object/cross-field captures are tracked in #660.
      lifecycle_state:
        status: intentionally_partial
        gap: Overcast can return Pending during Docker image prewarm and Active immediately otherwise; real Lambda provisioning state timing is not fully emulated.
      s3_object_version:
        status: fixed
        evidence: Code.S3ObjectVersion resolves against S3 object version history and fetches that version's bytes; an absent version or a delete marker fails the create with the same GetObject translation as an unreadable bucket or key, and persists nothing. Tests in tests/integration/lambda/create_function_code_version_test.go and tests/integration/cloudformation/lambda_s3_object_version_test.go.
      explicit_no_op_values:
        status: fixed
        evidence: A modeled-but-unimplemented member is refused only when the caller asked for it. An explicit null, false, "", [] or {} — AWS's own default for each gated member, and what SDKs and CloudFormation clear-values send — is a no-op and is accepted; any other value still returns 501.
    findings:
      fixed:
        - Zip CreateFunction requests without Code, Runtime, or Handler were accepted; now rejected as AWS InvalidParameterValueException.
        - Invalid PackageType, invalid Architectures, Timeout > 900, and MemorySize outside 128..32768 were accepted; now rejected.
        - Image CreateFunction requests with Runtime were accepted; now rejected.
      remaining_gaps:
        - Review Publish=true version creation and additional optional configuration fields before marking CreateFunction reviewed.
        - S3 Files FileSystemConfigs validate and round-trip, but execution-environment mounts require #647.
        - Real-AWS captures for exact collection validation values and empty ImageConfigResponse omission semantics are tracked in #648.
  AddPermission:
    status: intentionally_partial
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_AddPermission.html
      - https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
    protocol: REST JSON; POST /2015-03-31/functions/{FunctionName}/policy; 201 with serialized Statement
    tests:
      - tests/integration/lambda/policy_test.go::TestFunctionPolicy_AddGetRemoveLifecycle
      - tests/integration/cloudformation/lambda_properties_test.go::TestCreateAndDeleteStack_LambdaPermissionMutatesFunctionPolicy
    scenarios:
      resource_policy_statement:
        status: fixed
        evidence: AddPermission atomically stores validated AWS-shaped Allow statements, enforces policy size and RevisionId preconditions, and validates qualified targets. Policy authorization during invocation remains tracked in #629, so the capability is reported unsupported.
      required_statement_id:
        status: fixed
        evidence: An omitted StatementId returns an InvalidParameterValueException HTTP 400 required-member message; an explicitly empty StatementId returns the distinct minimum-length validation message. Constraint semantics come from the AWS model; exact service-rendered text is not published and remains unverified.
        tests:
          - tests/integration/lambda/validation_review_test.go::TestAddPermission_missingStatementID
          - tests/integration/lambda/validation_review_test.go::TestAddPermission_emptyStatementID
      exact_required_statement_id_text:
        status: blocked
        gap: The AWS model marks StatementId required with length 1..100, but exact service-rendered omission and empty-string messages need a permitted real-AWS capture before they can be claimed exact.
  GetPolicy:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_GetPolicy.html
    protocol: REST JSON; GET /2015-03-31/functions/{FunctionName}/policy; Policy is a JSON document serialized as a string
    tests:
      - tests/integration/lambda/policy_test.go::TestFunctionPolicy_AddGetRemoveLifecycle
      - tests/integration/cloudformation/lambda_properties_test.go::TestCreateAndDeleteStack_LambdaPermissionMutatesFunctionPolicy
  RemovePermission:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_RemovePermission.html
    protocol: REST JSON; DELETE /2015-03-31/functions/{FunctionName}/policy/{StatementId}; 204
    tests:
      - tests/integration/lambda/policy_test.go::TestFunctionPolicy_AddGetRemoveLifecycle
      - tests/integration/cloudformation/lambda_properties_test.go::TestCreateAndDeleteStack_LambdaPermissionMutatesFunctionPolicy
  CreateEventSourceMapping:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_CreateEventSourceMapping.html
      - https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-parameters.html
      - https://docs.aws.amazon.com/lambda/latest/dg/services-ddb-params.html
    protocol: REST JSON; POST /2015-03-31/event-source-mappings; 202
    tests:
      - tests/integration/lambda/esm_validation_test.go::TestCreateEventSourceMapping_batchSizeDefaultsBySource
      - tests/integration/lambda/esm_validation_test.go::TestCreateEventSourceMapping_batchSizeModelBounds
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_dynamoDBBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsFIFOBatchSizeMaximum
      - tests/integration/lambda/tags_test.go::TestCreateEventSourceMapping_StoresTags
      - tests/integration/lambda/tags_test.go::TestCreateEventSourceMapping_TagsSurviveRestart
      - tests/integration/cloudformation/lambda_esm_tags_test.go::TestCreateStack_LambdaEventSourceMappingCarriesStackTags
    scenarios:
      create_time_tags:
        status: fixed
        evidence: The Tags map is stored in the mapping's own tag namespace and read back through ListTags; EventSourceMappingConfiguration keeps AWS's shape and does not echo them. This is the ordinary CloudFormation path — a stack deployed with `--tags` merges them into every mapping — and refusing it previously failed every such deploy with a 501.
      source_specific_batch_defaults:
        status: fixed
        evidence: Omitted BatchSize defaults to 10 for SQS and 100 for DynamoDB Streams; explicit zero and negative values are rejected rather than treated as omission.
      batch_size_bounds:
        status: fixed
        evidence: The modeled 1..10000 bounds, SQS FIFO maximum 10, and the stream/SQS explicit-batch window coupling are enforced before persistence.
      batching_window_bounds:
        status: fixed
        evidence: MaximumBatchingWindowInSeconds enforces the modeled 0..300 range on create and update, including non-mutation after rejected updates.
      explicit_batch_window_invariant:
        status: fixed
        evidence: Persisted internal metadata distinguishes an explicitly configured batch above 10 from DynamoDB's omitted default of 100, so later window-only updates preserve the AWS constraint without rejecting the valid default combination.
      exact_batch_window_error_text:
        status: blocked
        gap: Constraint behavior is documented and the current wording matches a publicly reported CloudFormation-surfaced Lambda response, but exact direct-API text needs a permitted real-AWS capture before it can be claimed exact.
      exact_fifo_error_text:
        status: blocked
        gap: AWS documents the FIFO maximum of 10 but does not publish the service-side validation message; the current AWS-shaped InvalidParameterValueException text needs a permitted real-AWS capture before it can be claimed exact.
      fifo_batching_window:
        status: fixed
        evidence: Nonzero MaximumBatchingWindowInSeconds is rejected for SQS FIFO mappings on create and update, as documented by AWS; rejected updates do not mutate persisted state.
      exact_fifo_batching_window_error_text:
        status: blocked
        gap: AWS documents that FIFO batching windows are unsupported but does not publish the service-side validation message; exact text needs a permitted real-AWS capture.
  UpdateEventSourceMapping:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/api/API_UpdateEventSourceMapping.html
    protocol: REST JSON; PUT /2015-03-31/event-source-mappings/{UUID}; 202
    tests:
      - tests/integration/lambda/esm_validation_test.go::TestUpdateEventSourceMapping_batchSizeModelBounds
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_dynamoDBBatchSizeRequiresBatchWindow
      - tests/integration/lambda/esm_validation_test.go::TestEventSourceMapping_sqsFIFOBatchSizeMaximum
    scenarios:
      batch_size_validation:
        status: fixed
        evidence: Update rejects explicit zero, negative, above-model-maximum, FIFO-over-10, stream/SQS batch-over-10-without-window, invalid window bounds, and FIFO nonzero windows with HTTP 400 before mutation.
  Invoke:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html
      - https://docs.aws.amazon.com/lambda/latest/dg/adding-layers.html
      - https://docs.aws.amazon.com/lambda/latest/dg/with-secrets-manager.html
    protocol: REST JSON; POST /2015-03-31/functions/{FunctionName}/invocations
    tests:
      - go test -count=1 -run TestInvokeLayerCheck_foreignAccountCachedLayer ./internal/services/lambda
    scenarios:
      foreign_account_cached_layer:
        status: fixed
        evidence: Invoke-time layer validation now accepts foreign-account AWS-managed/third-party layer ARNs when the documented layer cache contains the layer zip, allowing the container layer injector to resolve the same cached content.
      missing_layer:
        status: reviewed
        evidence: Missing same-account layer metadata and uncached foreign-account layer ARNs still return a Lambda init-style layer version not found error before container startup.
      parameters_and_secrets_extension_cache:
        status: reviewed
        evidence: internal/services/lambda/container_runtime_test.go verifies that Lambda containers receive AWS_ENDPOINT_URL_SECRETS_MANAGER and local session credentials. The AWS extension binary owns its process-local cache and SECRETS_MANAGER_TTL; Overcast adds no cache in front of GetSecretValue, and a new Lambda container starts a new extension process.
findings:
  fixed:
    - Lambda resource-policy AddPermission, GetPolicy, and RemovePermission support race-safe AWS::Lambda::Permission create/delete orchestration; AddPermission remains reported unsupported until invocation authorization is enforced (#629).
    - CreateFunction and UpdateFunctionCode/Configuration preserve Architectures, VpcConfig including Ipv6AllowedForDualStack, ImageConfig, and FileSystemConfigs.
    - PutFunctionConcurrency rejects negative ReservedConcurrentExecutions with InvalidParameterValueException instead of storing an invalid throttle limit.
    - GetFunctionConcurrency answers 200 with an empty body for a function that has no reservation, as AWS does, rather than 404 ResourceNotFoundException; a reservation of 0 is still reported, so "switched off" stays distinguishable from "unset". Tests in tests/integration/lambda/reserved_concurrency_test.go.
    - DeadLetterConfig is accepted by CreateFunction and UpdateFunctionConfiguration and acted on: a failed asynchronous invocation is delivered to the target SQS queue or SNS topic with the original event as the body and AWS's RequestID/ErrorCode/ErrorMessage message attributes.
  remaining_gaps:
    - Finish CreateFunction Publish=true and advanced optional configuration review.
    - Review runtime invocation fidelity, error shapes, layers, and event source mappings.
    - Review Docker-unavailable fallback compatibility.
    - PutFunctionEventInvokeConfig is not implemented, so MaximumRetryAttempts and MaximumEventAgeInSeconds cannot be changed from AWS's defaults and an async event is never aged out; its on-failure/on-success destinations are still not applied outside event source mappings.
    - Implement S3 Files execution-environment mounts (#647) and close the remaining exact-wire capture questions (#648).
  intentionally_partial:
    - Resource policies are stored and observable but are not an authorization boundary for invocation.
handoff:
  start_with: [CreateFunction Publish=true, Invoke, event source mappings]
  do_not_redo: [CreateFunction required fields, CreateFunction PackageType/Image Runtime validation, CreateFunction Timeout/MemorySize/Architectures/VpcConfig/ImageConfig/FileSystemConfigs validation and storage, AddPermission/GetPolicy/RemovePermission basic policy lifecycle]
  commands:
    - go test -count=1 -run 'TestCreateFunction_' ./tests/integration/lambda/...
    - go test -count=1 ./internal/services/lambda/...
    - go vet ./internal/services/lambda/... ./tests/integration/lambda/... ./tests/integration/lambdadocker/...
