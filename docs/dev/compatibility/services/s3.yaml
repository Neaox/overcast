operations:
  ListObjectsV2:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_test.go::TestListObjectsV2_empty
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withObjects
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withPrefix
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withDelimiter_collapsesPrefixes
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withDelimiterAndPrefix_drillsIntoFolder
      - tests/integration/s3/s3_test.go::TestListObjectsV2_withDelimiterAndPrefix_listsLeafObjects
      - tests/integration/s3/s3_test.go::TestListObjectsV2_bucketNotFound
      - tests/integration/s3/s3_test.go::TestListObjectsV2_maxKeys_truncatesResult
      - tests/integration/s3/s3_test.go::TestListObjectsV2_continuationToken_resumesFromCorrectKey
      - tests/integration/s3/s3_test.go::TestListObjectsV2_continuationToken_lastPage_isNotTruncated
      - tests/integration/s3/s3_test.go::TestListObjectsV2_startAfter
    scenarios:
      - name: default empty bucket
        status: tested and matching AWS docs
      - name: lexicographic object listing
        status: tested and matching AWS docs
      - name: prefix filtering
        status: tested and matching AWS docs
      - name: delimiter common-prefix grouping
        status: tested and matching AWS docs
      - name: missing bucket
        status: tested and matching AWS docs
      - name: max-keys truncation and continuation-token pagination
        status: tested and matching AWS docs for claimed opaque-token support
      - name: start-after filtering and response echo
        status: fixed
      - name: fetch-owner owner elements
        status: intentionally_partial
        gap: Not implemented; owner metadata is not returned.
      - name: encoding-type=url percent-encoding
        status: intentionally_partial
        gap: Not implemented; keys are returned as stored.
      - name: request-payer and request-charged
        status: intentionally_partial
        gap: Requester Pays headers are not implemented.
      - name: optional-object-attributes RestoreStatus
        status: intentionally_partial
        gap: RestoreStatus is not implemented.
      - name: directory buckets, access points, and S3 on Outposts
        status: unsupported
        gap: Overcast supports general purpose bucket paths only.
    findings:
      fixed:
        - start-after was ignored and StartAfter was omitted from successful responses; fixed in this session.
      remaining_gaps:
        - Validate max-keys boundary and malformed values against AWS behavior.
        - Review encoding-type=url, fetch-owner, requester-pays, optional-object-attributes, and directory bucket caveats before marking reviewed.
  PutBucketVersioning:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketVersioning.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_test.go::TestPutBucketVersioning_enable
      - tests/integration/s3/s3_test.go::TestPutBucketVersioning_suspend
      - tests/integration/s3/s3_bucket_configuration_test.go::TestPutBucketVersioning_invalidStatusReturnsMalformedXML
      - tests/integration/s3/s3_versioning_test.go::TestVersioningSuspended_writesTheNullVersion
      - tests/integration/s3/s3_versioning_test.go::TestVersioningEnabled_afterObjectsExistTreatsThemAsNullVersions
      - tests/integration/cloudformation/s3_bucket_properties_test.go
    scenarios:
      - name: enabled and suspended state
        status: fixed
        notes: >-
          Enabled mints a version id per write; Suspended keeps existing versions,
          writes the single null version, and still creates a null-id delete marker
          on delete. Objects stored before the bucket was versioned become their
          key's null version (#645).
      - name: invalid status enum
        status: fixed
        notes: Values outside Enabled and Suspended return the S3 REST-XML MalformedXML schema-validation error and are not persisted.
  ListObjectVersions:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html
    implementation:
      - internal/services/s3/handler_versions.go
      - internal/services/s3/version.go
    tests:
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_orderIsKeyThenRecency
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_paginatesByKeyAndVersion
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_interleavesDeleteMarkers
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_delimiterCollapsesToCommonPrefixes
      - tests/integration/s3/s3_versioning_test.go::TestListObjectVersions_versionIdMarkerWithoutKeyMarker
      - tests/integration/s3/s3_test.go::TestListObjectVersions_nonVersionedBucket
    scenarios:
      - name: ordering
        status: fixed
        notes: Keys ascending, then versions most recently stored first, with Version and DeleteMarker elements interleaved.
      - name: key-marker and version-id-marker pagination
        status: fixed
        notes: >-
          Markers resume the scan without duplicating or dropping entries. A
          version-id-marker without a key-marker, or one naming no version of the
          marker key, returns InvalidArgument.
      - name: encoding-type=url
        status: unsupported
        gap: Response values are never URL-encoded, matching ListObjectsV2's existing gap.
  GetObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html
    implementation:
      - internal/services/s3/handler_object.go
    tests:
      - tests/integration/s3/s3_test.go::TestGetObject_missingBucketReturnsNoSuchBucket
      - tests/integration/s3/s3_test.go::TestGetObject_notFound
    scenarios:
      - name: read against a bucket that does not exist
        status: fixed
        notes: >-
          readTarget's unversioned branch called store.getObjectMeta directly — a
          single composite-key lookup that cannot distinguish "no such bucket" from
          "no such key in an existing bucket" — so both answered NoSuchKey. Real
          AWS (confirmed against real AWS in #1635's own repro, and matched by
          floci, kumo and ministack) answers NoSuchBucket. Fixed via a new
          readObjectMeta helper that checks the bucket first, mirroring what
          resolveVersion already did for the ?versionId= path. Shared by
          HeadObject (readTarget), GetObjectTagging and CopyObject's source
          lookup — see those operations below.
      - name: read of a missing key in an existing bucket
        status: fixed
        notes: Unaffected by the fix — still NoSuchKey (regression-tested).
  HeadObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_HeadObject.html
    implementation:
      - internal/services/s3/handler_object.go
    tests:
      - tests/integration/s3/s3_test.go::TestHeadObject_bucketNotFound
      - tests/integration/s3/s3_test.go::TestHeadObject_existingBucketMissingKeyReturnsNotFound
    scenarios:
      - name: read against a bucket that does not exist
        status: fixed
        notes: >-
          Shares readTarget's unversioned branch with GetObject, so the same
          internal fix applies (#1635). Wire-invisible for HEAD specifically:
          AWS's own HeadObject reference says a HEAD error is always a generic,
          bodyless status code and "it's not possible to retrieve the exact
          exception" — Overcast sets no x-amz-error-code or similar header
          either — so both the missing-bucket and missing-key-in-an-existing-
          bucket cases were and remain HTTP 404 with no body on the wire. Tests
          pin that pair down at the status-code level; the operation's own
          error-code correctness is verified through GetObject instead, since
          that is where it is observable.
  GetObjectTagging:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectTagging.html
    implementation:
      - internal/services/s3/handler_tagging.go
    tests:
      - tests/integration/s3/s3_test.go::TestGetObjectTagging_missingBucketReturnsNoSuchBucket
      - tests/integration/s3/s3_test.go::TestGetObjectTagging_missingKeyInExistingBucketReturnsNoSuchKey
    scenarios:
      - name: tagging read against a bucket that does not exist
        status: fixed
        notes: currentObjectForTagging called store.getObjectMeta directly with the same NoSuchKey-for-everything defect as GetObject; now routed through readObjectMeta (#1635). PutObjectTagging and DeleteObjectTagging share currentObjectForTagging and are corrected as a side effect.
  CopyObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_CopyObject.html
    implementation:
      - internal/services/s3/handler_object.go
    tests:
      - tests/integration/s3/s3_test.go::TestCopyObject_missingSourceBucket
      - tests/integration/s3/s3_test.go::TestCopyObject_missingSourceKey
    scenarios:
      - name: source bucket does not exist
        status: fixed
        notes: >-
          The source lookup called store.getObjectMeta(srcBucket, srcKey)
          directly, never checking srcBucket — which is independent of destBucket
          and was already resolved separately — so a missing source bucket
          answered NoSuchKey. AWS's CopyObject reference does not enumerate
          NoSuchBucket/NoSuchKey in its own Errors section (it lists only
          ObjectNotInActiveTierError), consistent with GetObject's reference page
          also omitting an Errors section — S3's generic-error set is evidently
          not restated per operation. Fixed on tier 2/3 evidence: the identical
          mechanism already confirmed for GetObject, applied via the same
          readObjectMeta helper.
      - name: destination bucket does not exist
        status: fixed
        notes: Already correct — CopyObject resolves destBucket via getBucket before doing anything else, so it already answered NoSuchBucket. Unaffected by this change.
      - name: source key missing in an existing source bucket
        status: fixed
        notes: Unaffected by the fix — still NoSuchKey (regression-tested, pre-existing test).
  DeleteObject:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObject.html
    implementation:
      - internal/services/s3/handler_object.go
      - internal/services/s3/version.go
    tests:
      - tests/integration/s3/s3_versioning_test.go::TestDeleteObject_versionedBucketCreatesADeleteMarker
      - tests/integration/s3/s3_versioning_test.go::TestDeleteObject_removingADeleteMarkerRestoresTheObject
      - tests/integration/s3/s3_versioning_test.go::TestDeleteObject_versionTargetedDeletePromotesTheNewestSurvivor
    scenarios:
      - name: delete marker creation
        status: fixed
        notes: A delete with no versionId against a versioned bucket removes nothing and reports x-amz-delete-marker with the marker's version id.
      - name: version-targeted delete
        status: fixed
        notes: Removes exactly that version and promotes the newest survivor when it was current.
      - name: unknown versionId
        status: intentionally_partial
        gap: Treated as idempotent (204) rather than pinned to a modelled error, matching DeleteObject's documented idempotency.
  PutBucketLifecycleConfiguration:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketLifecycleConfiguration.html
    implementation:
      - internal/services/s3/handler_lifecycle.go
      - internal/services/s3/lifecycle.go
    tests:
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_transitionDefaultMinimumObjectSizeRoundTrip
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_transitionDefaultMinimumObjectSizeDefaults
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_transitionDefaultMinimumObjectSizeIsReplaced
      - tests/integration/s3/s3_lifecycle_test.go::TestPutBucketLifecycleConfiguration_rejectsUnknownTransitionDefaultMinimumObjectSize
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_defaultMinimumSizeBlocksSmallTransitions
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_variesByStorageClassTransitionsSmallObjectsToGlacier
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_variesByStorageClassStillBlocksOtherClasses
      - internal/services/s3/lifecycle_test.go::TestSweepLifecycle_explicitSizeFilterOverridesTheDefaultMinimum
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_transitionDefaultMinimumObjectSizeDispatchesThroughS3
    scenarios:
      - name: x-amz-transition-default-minimum-object-size round trip
        status: fixed
        notes: >-
          Accepted on Put and echoed on both Put and Get; an omitted header reads
          back as AWS's all_storage_classes_128K default, and a value outside the
          enum returns InvalidArgument without storing anything.
      - name: default minimum applied by the sweeper
        status: fixed
        notes: >-
          Sub-128 KB objects do not transition under all_storage_classes_128K;
          under varies_by_storage_class they transition to GLACIER and
          DEEP_ARCHIVE only. A rule carrying its own ObjectSizeGreaterThan or
          ObjectSizeLessThan filter takes precedence over the default.
  DeleteBucketCors:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketCors.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_bucket_configuration_test.go::TestDeleteBucketCors_removesConfiguration
      - tests/integration/cloudformation/s3_bucket_properties_test.go
    scenarios:
      - name: configured bucket
        status: fixed
        notes: Returns 204 and subsequent GetBucketCors returns NoSuchCORSConfiguration.
  PutBucketNotificationConfiguration:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketNotificationConfiguration.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
    implementation:
      - internal/services/s3/handler_notifications.go
      - internal/services/s3/notifications.go
    tests:
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutBucketNotificationConfiguration_eventBridgeRoundTrip
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestGetBucketNotificationConfiguration_omitsEventBridgeWhenNotEnabled
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutBucketNotificationConfiguration_eventBridgeIsClearedByReplacement
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutObject_deliversObjectCreatedToEventBridge
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestDeleteObject_deliversObjectDeletedToEventBridge
      - tests/integration/s3/s3_eventbridge_notification_test.go::TestPutObject_noEventBridgeDeliveryWhenNotConfigured
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_eventBridgeNotificationDispatchesThroughS3
    scenarios:
      - name: EventBridgeConfiguration round trip
        status: fixed
        notes: >-
          Preserved alongside queue, topic and Lambda destinations; omitted from
          Get when unset, and cleared by a Put that omits it.
      - name: object events reach the default event bus
        status: fixed
        notes: >-
          Object Created and Object Deleted are published through EventBridge's
          own delivery path, so rule matching, input transformers, retries and
          DLQs behave as they do for PutEvents. Delivery is unfiltered, as on AWS.
      - name: event detail completeness
        status: intentionally_partial
        gap: >-
          request-id, requester, source-ip-address, sequencer and version-id are
          omitted rather than fabricated. Restore, storage-class, tagging and ACL
          detail-types have no corresponding Overcast operation and are not emitted.
  PutBucketWebsite:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketWebsite.html
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketWebsite.html
    implementation:
      - internal/services/s3/handler_website.go
    tests:
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_redirectAllRequestsToRoundTrip
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_routingRulesRoundTrip
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_replacesTheWholeConfiguration
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_validation
      - tests/integration/s3/s3_website_test.go::TestPutBucketWebsite_rejectedConfigurationIsNotStored
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_websiteRedirectAndRoutingRulesDispatchThroughS3
      - tests/integration/cloudformation/s3_bucket_properties_test.go::TestS3BucketProperties_websiteRedirectAllDispatchesThroughS3
    scenarios:
      - name: RedirectAllRequestsTo round trip
        status: fixed
        notes: HostName and the optional Protocol are preserved; an omitted Protocol is not serialised as an empty enum.
      - name: RoutingRules round trip
        status: fixed
        notes: >-
          Condition (HttpErrorCodeReturnedEquals, KeyPrefixEquals) and Redirect
          (HostName, HttpRedirectCode, Protocol, ReplaceKeyPrefixWith,
          ReplaceKeyWith) survive in AWS's unflattened RoutingRules/RoutingRule shape.
      - name: documented mutual exclusion and field constraints
        status: fixed
        notes: >-
          RedirectAllRequestsTo cannot be combined with IndexDocument, ErrorDocument
          or RoutingRules; one of RedirectAllRequestsTo and IndexDocument is required;
          Protocol is restricted to the http/https enum; the IndexDocument Suffix must
          be non-empty and slash-free; a Redirect must name a destination and cannot
          carry both ReplaceKeyWith and ReplaceKeyPrefixWith; a Condition needs a
          predicate. Refusals return InvalidArgument and store nothing.
      - name: Redirect HttpRedirectCode value validation
        status: intentionally_partial
        gap: >-
          Real S3 rejects a code that is not a valid HTTP redirect status. The model
          does not pin the error, so the value is stored rather than refused.
      - name: website endpoint serving
        status: unsupported
        gap: Overcast stores and returns the configuration but serves no S3 website endpoint.
  DeleteBucketWebsite:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketWebsite.html
    implementation:
      - internal/services/s3/handler_bucket.go
    tests:
      - tests/integration/s3/s3_bucket_configuration_test.go::TestDeleteBucketWebsite_removesConfiguration
      - tests/integration/cloudformation/s3_bucket_properties_test.go
    scenarios:
      - name: configured bucket
        status: fixed
        notes: Returns 204 and subsequent GetBucketWebsite returns NoSuchWebsiteConfiguration.
findings:
  fixed:
    - PutBucketNotificationConfiguration preserves EventBridgeConfiguration and publishes object events to the default event bus (#635).
    - PutBucketWebsite/GetBucketWebsite preserve RedirectAllRequestsTo and RoutingRules and enforce AWS's mutual exclusion (#637).
    - PutBucketLifecycleConfiguration honours x-amz-transition-default-minimum-object-size, reports it on Put and Get, and gates sub-128 KB transitions on it (#636).
    - PutBucketVersioning now rejects invalid status enum values with MalformedXML instead of persisting arbitrary strings.
    - Object version history, delete markers, version-targeted reads/deletes, ListObjectVersions ordering/pagination, and sweeper execution of NoncurrentVersionExpiration, NoncurrentVersionTransition and ExpiredObjectDeleteMarker (#645).
    - DeleteBucketCors and DeleteBucketWebsite now clear stored configurations and return 204.
    - CloudFormation AWS::S3::Bucket uses the S3 handlers for lifecycle, versioning, notifications, encryption, tags, CORS, and website configuration.
    - GetObject, GetObjectTagging and CopyObject's source lookup now answer NoSuchBucket for a bucket that does not exist, instead of NoSuchKey (#1635); HeadObject is wire-identical either way per AWS's own documented HEAD limitation.
  remaining_gaps:
    - Finish ListObjectsV2 optional-parameter review before marking the operation reviewed.
    - Verify CDK bootstrap bucket flows and policy/versioning/tagging edge cases.
    - CORS rule Id and encryption BlockedEncryptionTypes are not represented by the current stored/wire models.
  intentionally_partial:
    - EventBridge object-event detail omits request-id, requester and source-ip-address, which Overcast has no truthful value for; version-id and sequencer are now populated from the object version history (#645), and only Object Created and Object Deleted are emitted.
    - Website configuration is stored and returned in full, but Overcast serves no S3 website endpoint, so no request is redirected; Redirect HttpRedirectCode values are stored without validation because the model does not pin AWS's error.
    - GetObjectAttributes, RestoreObject and SelectObjectContent remain unimplemented, so no version-aware behaviour is claimed for them.
handoff:
  start_with: [ListObjectsV2 max-keys validation, ListObjectsV2 encoding-type, PutBucketPolicy, CDK bootstrap, issue 635, issue 636, issue 637]
  do_not_redo: [ListObjectsV2 start-after, ListObjectsV2 continuation-token happy path, DeleteBucketCors, DeleteBucketWebsite, PutBucketVersioning status validation, CloudFormation S3 bucket seven-property dispatch, object version history and noncurrent lifecycle execution]
  commands: [go test -count=1 ./internal/services/s3/... ./tests/integration/s3/...]
