service: secretsmanager
status: fixed
priority: p1
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-08-06
protocols: [aws_json_1_1, aws_json_1_0, rpcv2_cbor]
implementation: [internal/services/secretsmanager]
integration_tests: [tests/integration/secretsmanager]
capability_docs: docs/services/secretsmanager.md
operation_count_estimate: 22 tracked; 19 supported, 3 unsupported
current_support_level: Core CRUD, versioning, KMS key metadata, tags, random password, rotation, and resource-policy storage supported; replication and restore stubbed.
operations:
  CreateSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_CreateSecret.html
    protocol: AWS JSON 1.1; POST / with X-Amz-Target secretsmanager.CreateSecret
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
      - tests/integration/cloudformation/generate_secret_string_test.go::TestCreateStack_generateSecretStringPopulatesAwsCurrent
    scenarios:
      kms_key_metadata:
        status: fixed
        evidence: KmsKeyId is persisted during CreateSecret and returned by DescribeSecret and ListSecrets; CloudFormation forwards the property through CreateSecret.
      cloudformation_tags:
        status: fixed
        evidence: AWS::SecretsManager::Secret resource tags and propagated stack tags are merged with resource-level precedence and forwarded through CreateSecret; updates reconcile through TagResource and UntagResource.
      generated_secret_value:
        status: fixed
        evidence: CloudFormation validates JSON-object templates and GenerateStringKey collisions before mutation, calls GetRandomPassword, and stores the generated value through CreateSecret for GetSecretValue readback.
  UpdateSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_UpdateSecret.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
    scenarios:
      kms_key_metadata:
        status: fixed
        evidence: An explicitly supplied KmsKeyId updates stored metadata without creating a new secret version and is returned by DescribeSecret and ListSecrets.
  DescribeSecret:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_DescribeSecret.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
  ListSecrets:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_ListSecrets.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestSecretKMSKeyIdRoundTripsThroughCreateUpdateDescribeAndList
  GetRandomPassword:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetRandomPassword.html
    tests:
      - tests/integration/secretsmanager/secretsmanager_test.go::TestGetRandomPassword_rejectsOutOfRangeLength
      - tests/integration/secretsmanager/secretsmanager_test.go::TestGetRandomPassword_default
    scenarios:
      omission_and_bounds:
        status: fixed
        evidence: Omitted PasswordLength defaults to 32 while explicit values outside the modeled 1..4096 range return InvalidParameterException; ExcludeCharacters enforces its modeled 4096-character maximum before generation.
findings:
  fixed:
    - CreateSecret and UpdateSecret dropped KmsKeyId, and DescribeSecret/ListSecrets could not return it; the metadata now persists and round-trips.
    - GetRandomPassword treated explicit zero as omission and accepted oversized lengths; omission and modeled bounds are now distinct.
    - CloudFormation generated-secret template validation ran after password generation, panicked for JSON null, and overwrote GenerateStringKey collisions; validation is now pre-dispatch and non-mutating.
    - AWS::SecretsManager::Secret dropped KmsKeyId and Tags on create; both now flow through Secrets Manager APIs, including stack-tag propagation and update reconciliation.
  remaining_gaps:
    - Review deletion recovery semantics and unsupported replication operations; CloudFormation ReplicaRegions is tracked in #679.
    - Remove duplicated/non-generated summary drift risk in docs if present.
    - Changing CloudFormation GenerateSecretString settings does not yet create a new secret version as AWS documents (#678).
  intentionally_partial:
    - KmsKeyId is observable metadata only; Overcast does not encrypt secret payloads through the KMS emulator.
handoff:
  start_with: [DeleteSecret recovery semantics, replication operations, CloudFormation GenerateSecretString updates]
  do_not_redo:
    - Create/Update/Describe/List KmsKeyId metadata round-trip and CloudFormation create/tag forwarding are covered by issue 526 tests.
  commands: [go test -count=1 ./internal/services/secretsmanager/... ./tests/integration/secretsmanager/... ./tests/integration/cloudformation/...]
