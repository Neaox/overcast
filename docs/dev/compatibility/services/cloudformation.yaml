service: cloudformation
status: implementation_mismatch
priority: p0
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-08-06
protocols: [query]
implementation: [internal/services/cloudformation]
integration_tests: [tests/integration/cloudformation]
capability_docs: docs/services/cloudformation.md
operation_count_estimate: 47 API/intrinsic/resource rows; 19 supported, 28 unsupported; separate resource type matrix
current_support_level: CDK stack lifecycle and provisioner support; many StackSet/type registry features unsupported.
operations:
  CreateStack:
    status: implementation_mismatch
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-sqs-queue.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-s3-bucket.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-lambda-function.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-lambda-permission.html
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
    tests:
      - tests/integration/cloudformation/cloudformation_test.go
    scenarios:
      - name: sqs queue ref output resolves to queue url
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go
        notes: AWS::SQS::Queue Ref returns the queue URL, while Fn::GetAtt Arn returns the queue ARN. The SQS resource handler now preserves that Ref override on create and update.
      - name: sqs fifo generated queue name and attributes
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go
        notes: AWS::SQS::Queue with FifoQueue true and no QueueName now generates a .fifo queue name and forwards FIFO attributes to SQS.
      - name: resource ref overrides for non-name physical ids
        status: implementation_mismatch
        tests: []
        notes: Audit found likely gaps for IAM Policy, IAM InstanceProfile, IAM ServiceLinkedRole, Events EventBus, and Events Rule. Each needs AWS-doc-backed Ref tests before changing behavior.
      - name: scheduled fargate event rule targets
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestCreateStack_ScheduledFargateRuleTargets
        notes: AWS::Events::Rule create now provisions Targets through PutTargets, preserving ECS/Fargate target parameters used by CDK scheduled task stacks. EventBridge can execute scheduled ECS/Fargate targets through ECS RunTask.
      - name: sns topic and subscription property forwarding
        status: fixed
        tests:
          - tests/integration/cloudformation/sns_test.go::TestCreateStack_SNSSubscriptionAttributesFilterAndRawDelivery
          - tests/integration/cloudformation/sns_test.go::TestCreateStack_SNSTopicInlineSubscription
          - tests/integration/cloudformation/sns_test.go::TestUpdateStack_SNSTopicAttributes
          - tests/integration/cloudformation/sns_test.go::TestUpdateStack_SNSTopicInlineSubscriptionsFailLoudly
        notes: AWS::SNS::Topic applies supported attributes during create and update; standalone subscriptions apply supported attributes after Subscribe; inline topic subscriptions dispatch through SNS. Unsupported topic Tags dispatch to SNS TagResource and fail rather than being discarded.
      - name: s3 bucket sub-resource property dispatch
        status: fixed
        tests:
          - tests/integration/cloudformation/s3_bucket_properties_test.go
        notes: AWS::S3::Bucket translates lifecycle, versioning, notification, encryption, tag, CORS, and website properties to S3 REST-XML handlers on create and update. Removal deletes or clears the S3 configuration, and versioning removal suspends because S3 cannot return a versioned bucket to unversioned state. Unknown and untranslatable fields fail before bucket creation.
      - name: lambda function advanced properties and permission lifecycle
        status: fixed
        tests:
          - tests/integration/cloudformation/lambda_properties_test.go
        notes: AWS::Lambda::Function forwards every reviewed Function property and applies configuration, code, then reserved concurrency transactionally; unsupported advanced fields fail at Lambda before mutation, and a failed sub-operation triggers immediate compensation. EventSourceMapping forwards every reviewed property so Lambda either stores supported fields or rejects unsupported semantics. AWS::Lambda::Permission calls race-safe Lambda policy APIs rather than succeeding as a no-op stub. Shared reverse-update rollback restores successful in-place changes when a later stack resource fails.
      - name: dynamodb table local secondary indexes on create
        status: fixed
        tests:
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestCreateStack_DynamoDBTableLocalSecondaryIndex
        notes: AWS::DynamoDB::Table forwards LocalSecondaryIndexes to CreateTable, so an LSI declared in a new stack is immediately available to Query.
  DescribeChangeSet:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeChangeSet.html
    scenarios:
      - name: arn-only change set lookup
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestDescribeChangeSet_changeSetArn
        notes: ChangeSetName may be a full change set ARN; StackName is required only for short change set names.
  ExecuteChangeSet:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ExecuteChangeSet.html
    scenarios:
      - name: arn-only change set lookup
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestExecuteChangeSet_changeSetArn
        notes: ChangeSetName may be a full change set ARN; StackName is required only for short change set names.
  ListChangeSets:
    status: fixed
    aws_docs:
      - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_ListChangeSets.html
    scenarios:
      - name: created change sets appear in stack summary list
        status: fixed
        tests:
          - tests/integration/cloudformation/cloudformation_test.go::TestListChangeSets_createdChangeSet
        notes: Created change sets are listed for their stack by name or stack ARN.
findings:
  fixed:
    - AWS::SQS::Queue Ref now resolves to the queue URL instead of the ARN, so CDK queue.queueUrl outputs are externally usable by SQS clients.
    - AWS::SQS::Queue FifoQueue now creates a FIFO-compatible generated physical name and FifoQueue=true queue attributes.
    - DescribeChangeSet and ExecuteChangeSet now accept full change set ARN lookup without StackName, and ListChangeSets returns created change sets for the stack.
    - AWS::Events::Rule create provisions targets, including ECS/Fargate target metadata used by CDK scheduled task stacks.
    - AWS::SNS::Topic and AWS::SNS::Subscription forward supported configuration through SNS during stack provisioning, including raw delivery and message-body filtering.
    - AWS::S3::Bucket create/update/removal dispatches seven sub-resource property families through S3 instead of silently dropping them.
    - AWS::Lambda::Function no longer drops priority configuration properties, and AWS::Lambda::Permission now mutates the function's Lambda-owned resource policy.
    - AWS::DynamoDB::Table forwards LocalSecondaryIndexes through CreateTable on initial stack provisioning.
  remaining_gaps:
    - Audit resource-type tracking against provisioner registrations.
    - Add CloudFormation Ref compatibility tests for resource handlers whose physical ID differs from documented Ref semantics.
    - Implement cross-region AWS::SNS::Subscription Region semantics (tracked in #633).
    - Review update/delete semantics and unsupported-resource stubbing.
    - Add support for S3 EventBridge notifications (#635), lifecycle transition minimum object size (#636), and website redirects/routing rules (#637); CloudFormation currently fails these shapes loudly.
  intentionally_partial: []
handoff:
  start_with: [CloudFormation Ref semantics for IAM and EventBridge resource handlers, CreateStack, DeleteStack, resource handlers]
  do_not_redo:
    - Change set ARN-only lookup for DescribeChangeSet and ExecuteChangeSet; covered by TestDescribeChangeSet_changeSetArn and TestExecuteChangeSet_changeSetArn.
    - ListChangeSets returning created stack change sets; covered by TestListChangeSets_createdChangeSet.
    - AWS::Events::Rule target creation for scheduled Fargate tasks; covered by TestCreateStack_ScheduledFargateRuleTargets.
    - AWS::S3::Bucket lifecycle, versioning, notification, encryption, tags, CORS, and website dispatch; covered by s3_bucket_properties_test.go.
  commands: [go test -count=1 ./internal/services/cloudformation/... ./tests/integration/cloudformation/...]
