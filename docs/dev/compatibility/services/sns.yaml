        - tests/integration/sns/sns_test.go::TestPublish_messageStructureJson_fallsBackToDefault
        - tests/integration/sns/sns_test.go::TestPublish_messageStructureJson_rawDeliveryUsesSelectedMessage
        - tests/integration/sns/sns_test.go::TestPublish_messageStructureJson_missingDefault
        - tests/integration/sns/sns_test.go::TestPublish_messageStructureJson_invalidJSON
