current_support_level: Pipe CRUD supported. Sources: DynamoDB Streams, Kinesis, SQS. Optional Lambda enrichment. Targets: Lambda, SQS, SNS, Step Functions, Kinesis, Firehose, EventBridge bus. Unsupported combinations are rejected at CreatePipe/UpdatePipe.
operations: {}
findings:
  fixed:
    - Sources beyond DynamoDB Streams (Kinesis, SQS) and targets beyond SQS (#470).
    - Optional Lambda enrichment between source and target (#470).
    - Unsupported source/target/enrichment combinations now fail at CreatePipe/UpdatePipe instead of being stored and ignored (#470).
    - CreatePipe returns AWS's 200 with the six-member response body (#470).
    - Reconciled the stale service comment about UpdatePipe.
  remaining_gaps:
    - FilterCriteria is rejected rather than evaluated; a pattern matcher would need the EventBridge one extracted.
    - MaximumBatchingWindowInSeconds, ParallelizationFactor and partial-batch failure reporting are not emulated.
    - LogConfiguration and KmsKeyIdentifier are accepted but have no effect.
  intentionally_partial:
    - RoleArn is required but never evaluated - Overcast is not a security boundary.
