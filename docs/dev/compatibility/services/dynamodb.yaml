service: dynamodb
status: not_started
priority: p0
reference_policy: aws_docs_only_unless_user_approves_real_aws
last_updated: 2026-08-21
protocols: [aws_json_1_0, rpcv2_cbor]
implementation: [internal/services/dynamodb]
integration_tests: [tests/integration/dynamodb]
capability_docs: docs/services/dynamodb.md
operation_count_estimate: 28 tracked; 21 supported, 7 unsupported
current_support_level: Strong table, item, query, transaction, index, and stream support; PartiQL out of scope.
operations: {}
findings:
  fixed:
    - scenario: CloudFormation forwards AWS::DynamoDB::Table LocalSecondaryIndexes to CreateTable, while removal or modification fails without mutating the table because LSI updates are unsupported.
      evidence:
        aws_docs:
          - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
          - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-dynamodb-table-localsecondaryindex.html
        tests:
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestCreateStack_DynamoDBTableLocalSecondaryIndex
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestUpdateStack_DynamoDBTableLocalSecondaryIndexes
          - internal/services/cloudformation/dynamodb_table_update_test.go
    - scenario: CloudFormation applies AWS::DynamoDB::Table TimeToLiveSpecification with UpdateTimeToLive, including attribute changes and property removal.
      evidence:
        aws_docs:
          - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-dynamodb-table-timetolivespecification.html
          - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_UpdateTimeToLive.html
        tests:
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestCreateStack_DynamoDBTableTimeToLive
          - tests/integration/cloudformation/dynamodb_table_properties_test.go::TestUpdateStack_DynamoDBTableTimeToLive
          - internal/services/cloudformation/dynamodb_ttl_test.go
    - scenario: CreateTable rejects invalid table names outside the documented 3..255 character alphanumeric, hyphen, underscore, and period rules.
      evidence:
        aws_docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.NamingRulesDataTypes.html
        tests:
          - tests/integration/dynamodb/dynamodb_test.go::TestCreateTable_invalidName
    - scenario: Scan returns Count after filtering and ScannedCount for evaluated items, including Limit-before-filter semantics.
      evidence:
        aws_docs: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_Scan.html
        tests:
          - tests/integration/dynamodb/dynamodb_test.go::TestScan_Limit_Pagination
          - tests/integration/dynamodb/dynamodb_test.go::TestScan_scannedCountWithoutFilter
          - tests/integration/dynamodb/dynamodb_test.go::TestScan_scannedCountWithFilter
          - tests/integration/dynamodb/dynamodb_test.go::TestScan_scannedCountWithLimitAndFilter
      fixed_in: 0.0.1-alpha.7
    - scenario: DeleteTable deletes the table's stream records, so a table recreated under the same name gets an empty stream instead of replaying the deleted table's changes from TRIM_HORIZON. Stream records are keyed by table name and were never deleted; DescribeStream correctly reported a new stream ARN and label for the recreated table, which made the inherited history harder to spot.
      evidence:
        aws_docs: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
        tests:
          - tests/integration/dynamodb/streams_test.go::TestStream_recreatedTableStartsWithAnEmptyStream
    - scenario: >-
        CreateTable owns billing-mode defaulting and throughput validation. An omitted BillingMode is
        PROVISIONED, which requires ReadCapacityUnits and WriteCapacityUnits on the table and on every
        global secondary index; PAY_PER_REQUEST rejects both. Validation runs before the table is
        stored. CloudFormation forwards BillingMode and ProvisionedThroughput unchanged instead of
        substituting PAY_PER_REQUEST whenever ProvisionedThroughput was absent, so AWS::DynamoDB::Table
        surfaces DynamoDB's ValidationException through stack failure.
      evidence:
        aws_docs:
          - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_CreateTable.html
          - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
        aws_models: >-
          models/aws revision 66e973ca — CreateTableInput.ProvisionedThroughput: "If you set BillingMode
          as PROVISIONED, you must specify this property. If you set BillingMode as PAY_PER_REQUEST, you
          cannot specify this property." ProvisionedThroughput.ReadCapacityUnits and .WriteCapacityUnits
          are both smithy.api#required and target PositiveLongObject (range min 1).
        tests:
          - tests/integration/dynamodb/create_table_billing_test.go
          - tests/integration/cloudformation/dynamodb_table_billing_test.go
    - scenario: >-
        A DynamoDB operation AWS models but Overcast has not implemented (CreateGlobalTable,
        DescribeGlobalTable, backups, exports, PartiQL, resource policies, ...) answers 501 with
        x-emulator-unsupported: true in the AWS JSON 1.0 error envelope, instead of the 400
        UnknownOperationException it used to fall through to. UnknownOperationException is preserved
        for an X-Amz-Target that names no modeled operation. Ownership is read from the generated
        registry in internal/awsapi, so the set cannot drift from the pinned models.
      evidence:
        aws_docs: https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_Operations.html
        tests:
          - tests/integration/dynamodb/unsupported_operations_test.go
    - scenario: >-
        CloudFormation no longer drops properties DynamoDB implements (#523). AWS::DynamoDB::Table
        applies Tags via TagResource on create and reconciles them via Tag/UntagResource on update, and
        reconciles GlobalSecondaryIndexes add/remove/throughput-change through
        GlobalSecondaryIndexUpdates on update — previously forwarded on create only. A KeySchema or
        Projection change on an existing index is rejected rather than attempted as an implicit
        delete+recreate. AWS::DynamoDB::GlobalTable, previously a no-op stub, now provisions the Replicas
        entry naming the stack's own region as a real table by delegating into AWS::DynamoDB::Table's
        handler, forcing NEW_AND_OLD_IMAGES streaming and defaulting BillingMode to PAY_PER_REQUEST;
        PROVISIONED billing and a Replicas list missing the stack's own region both fail the stack rather
        than silently completing.
      evidence:
        aws_docs:
          - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
          - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-globaltable.html
          - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_UpdateTable.html
          - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_TagResource.html
        tests:
          - tests/integration/cloudformation/dynamodb_table_tags_test.go
          - tests/integration/cloudformation/dynamodb_gsi_update_test.go
          - tests/integration/cloudformation/dynamodb_global_table_test.go
  remaining_gaps:
    - Review expression edge cases, pagination semantics, and GSI/LSI behavior.
    - Review CBOR coverage against SDK expectations.
    - UpdateTable applies BillingMode without the throughput validation CreateTable now enforces, so switching a table to PROVISIONED without ProvisionedThroughput is accepted where AWS answers "One or more parameter values were invalid: ProvisionedThroughput must be specified when BillingMode is PROVISIONED".
    - AWS::DynamoDB::Table/GlobalTable SSESpecification, PointInTimeRecoverySpecification, DeletionProtectionEnabled, TableClass, KinesisStreamSpecification, ContributorInsightsSpecification, ImportSourceSpecification, ResourcePolicy, and OnDemandThroughput are not applied — DynamoDB itself has no support for any of them, so CloudFormation cannot honestly forward them either.
    - AWS::DynamoDB::GlobalTable offers no real cross-region replication; Overcast emulates a single region and provisions only the Replica naming the stack's own region.
  intentionally_partial: []
handoff:
  start_with: [Query, Scan, UpdateItem, transactions]
  do_not_redo: []
  commands: [go test -count=1 ./internal/services/dynamodb/... ./tests/integration/dynamodb/...]
